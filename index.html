/* ---------- derived helpers ---------- */
const taskOf = o => o.taskId ? db.tasks.find(t=>t.id===o.taskId) : null;
const occName = o => o.taskId ? (taskOf(o)?.name ?? "(削除済み)") : (o.title || "無題");
const occCat  = o => o.category || taskOf(o)?.category || "";
const occMin  = o => o.actualMin ?? o.plannedMin ?? taskOf(o)?.estMin ?? 0;
const occsOn  = d => db.occurrences.filter(o=>o.date===d);
/* v3.122: 「ひと段落」機能用。[fromKey,untilKey) の間で、その日すでに時間が
   決まっている実施（plannedStart+plannedMinが両方ある——予定=plan:trueの
   帯だけでなく、夕食のような継続型タスクのoccurrenceも対象。食事はplan行
   ではなく継続型タスクとして保存されるため、plan有無では絞れない）を占有
   区間とみなし、それ以外の空きギャップを時系列順に返す。先送り
   （status:"deferred"）はその日の枠を手放しているとみなし占有扱いしない。 */
function freeGapsFrom(date, fromKey, untilKey){
  if(fromKey >= untilKey) return [];
  const busy = occsOn(date)
    // freeBlock=true の予定（例: テンプレの「自由時間」）はタイムライン上は
    // そのまま表示されるが、ひと段落の占有判定からは除外する——空いている
    // ことを明示するためだけの予定枠なので、隙間として使えるようにする。
    .filter(o => o.plannedStart && o.plannedMin && o.status!=="deferred" && o.status!=="skipped" && !o.freeBlock)
    .map(o => { const s = timeKey(o.plannedStart); return [s, s + o.plannedMin]; })
    .map(([s,e]) => [Math.max(s, fromKey), Math.min(e, untilKey)])
    .filter(([s,e]) => e > s)
    .sort((a,b) => a[0]-b[0]);

  const merged = [];
  busy.forEach(([s,e]) => {
    const last = merged[merged.length-1];
    if(last && s <= last[1]) last[1] = Math.max(last[1], e);
    else merged.push([s,e]);
  });

  const gaps = [];
  let cur = fromKey;
  merged.forEach(([s,e]) => { if(s > cur) gaps.push({start:cur, end:s}); cur = Math.max(cur, e); });
  if(cur < untilKey) gaps.push({start:cur, end:untilKey});
  return gaps;
}
// v3.100: タスク一覧（タスクタブ・タスクの編集シート）から進捗メモを見るとき、
// 「今日の実施」に絞らず一番新しい実施を見る——今日まだ置いていない残タスク
// でも、前回どこまでやったかをタスク一覧側から常に確認できるようにするため
// （履歴タブまで探しに行かないと分からない、という指摘への対応）。
const latestOccOf = taskId => {
  const list = db.occurrences.filter(o=>o.taskId===taskId && !o.plan);
  if(!list.length) return null;
  return list.reduce((a,b)=> b.date > a.date ? b : a);
};

/* ---- ざっくり期日（v3.11 試験実装） ----
   完了型の 期限／開始時期 は「日付」のほか「上旬/中旬/下旬/月」の粒度で入れられる。
   保存はどちらも常に具体的な YYYY-MM-DD（"実効日"）にする — 既存の並べ替え・
   バケット分け（dueBucket/byDue）は一切変更不要になる。実効日の決め方:
     期限   の 月   → その月の末日（"月内に"の最遅日）
     開始時期の 月   → その月の1日（"その月から"の最速日）
     上旬/中旬/下旬 → 5日/15日/25日を代表日にする
   `duePrec`/`startPrec`（既定 "day"）は表示の丸め方だけに使う。 */
const PRECS = ["day","early","mid","late","month"];
const PREC_LABEL = { day:"日付", early:"上旬", mid:"中旬", late:"下旬", month:"月" };
const PREC_SUF_SHORT = { early:"B", mid:"M", late:"E" };   // Begin/Middle/End（一覧の枠用の略）
const daysInMonth = (y,m) => new Date(y, m, 0).getDate();   // m は 1〜12
/* "YYYY-MM" + 粒度 → 実効日 "YYYY-MM-DD"（期限=月末寄り、開始=月初寄り） */
const effDateFromMonth = (ym, prec, forDue) => {
  const [y,m] = ym.split("-").map(Number);
  const day = prec==="early" ? 5 : prec==="mid" ? 15 : prec==="late" ? 25
            : (forDue ? daysInMonth(y,m) : 1);
  return `${y}-${pad(m)}-${pad(day)}`;
};
/* 実効日から編集シート用に月部分だけ取り出す（粒度が day 以外のとき） */
const monthOf = s => s ? s.slice(0,7) : "";
/* 表示: 通常の日付は今年なら M/D、他年は YYYY年M/D。粒度ありは M月[上旬/中旬/下旬]。 */
const dateLabel = (s, prec) => {
  if(!s) return "";
  const [y,m,d] = s.split("-");
  const yr = (+y) !== new Date().getFullYear() ? `${y}年` : "";
  if(!prec || prec==="day") return `${yr}${+m}/${+d}`;
  return `${yr}${+m}月${PREC_SUF_SHORT[prec] ? PREC_LABEL[prec] : ""}`;
};
/* 一覧の枠用に短く: 今年は M/D、他年は YY/M/D。粒度ありは M月 / M上 / M中 / M下。 */
const mdShort = (s, prec) => {
  if(!s) return "";
  const [y,m,d] = s.split("-");
  const yr = (+y) !== new Date().getFullYear() ? `${y.slice(2)}/` : "";
  if(!prec || prec==="day") return `${yr}${+m}/${+d}`;
  if(prec==="month") return `${yr}${+m}月`;
  return `${yr}${+m} ${PREC_SUF_SHORT[prec]}`;
};

/* 期限（完了型タスクの任意フィールド）: バケット 0=期限切れ/今日 1=7日以内 2=先 3=なし */
const dueBucket = due => {
  if(!due) return 3;
  const T = todayStr();
  return due <= T ? 0 : due <= addDays(T,7) ? 1 : 2;
};
const dueText = (due, prec) => {
  const T = todayStr(), lab = dateLabel(due, prec);
  return due < T ? `期限切れ ${lab}` : due === T ? "今日まで" : `期限 ${lab}`;
};
/* 期限の強調表示: 期限切れ・今日まで（バケット0）＝オレンジ「over」、
   7日以内（バケット1、今日は除く）＝黄「soon」、それより先／なし＝無色。
   v3.59: 「今日まで」だけをオレンジにしていたのを「期限切れ・今日まで」に広げ、
   代わりに「7日以内」を新設の黄色にした（dueBucket の区切りをそのまま使う）。 */
const dueClass = due => !due ? "" : dueBucket(due)===0 ? "over" : dueBucket(due)===1 ? "soon" : "";
const dueChip = (due, prec) => `<span class="ti-due ${dueClass(due)}">${dueText(due,prec)}</span>`;
const byDue = (a,b) => (a.due||"9999-99-99").localeCompare(b.due||"9999-99-99")
  || (a.createdAt||"").localeCompare(b.createdAt||"");

/* 完了型タスクの並べ替え軸: 重要度（既定=無＝内部値は引き続き "low"）。
   v3.34: 開始時期は並び順の判断材料には含めない（下記参照）。 */
const PRIO = { high:"高", mid:"中", low:"無" };
const prioRank = t => ({ high:0, mid:1, low:2 }[t.prio || "low"]);
const prioChip = t => { const p = t.prio || "low"; return `<span class="ti-prio ${p}">重要 ${PRIO[p]}</span>`; };

// v3.103: 覚え書きの「表示期間」（開始・終了とも任意）。設定が無い側は
// 制限なしとして扱う。期間外かどうかは「今日」で判定する。
const remarkInPeriod = r => {
  const T = todayStr();
  if(r.showFrom && T < r.showFrom) return false;
  if(r.showTo && T > r.showTo) return false;
  return true;
};
// 表示すべきもの（期間内）を先に、期間外を下に送り、同じ側の中では重要度順
// （高→中→無）にする。それ以外は元の並び（新しい順）を保つ安定ソート。
const byRemarkShow = (a,b) => {
  const pa = remarkInPeriod(a) ? 0 : 1, pb = remarkInPeriod(b) ? 0 : 1;
  return (pa - pb) || (prioRank(a) - prioRank(b));
};
/* 継続型タスクの「種類」タグ（v3.41）: スキル（練習して伸ばすもの）か
   ルーティン（生活のために毎日こなすもの）かを区別する表示専用タグ。
   完了型タスクには出さない。未設定は「ルーティン」扱い。 */
const RTYPE = { skill:"スキル", routine:"ルーティン" };
const rtypeChip = t => { const r = t.rtype || "routine"; return `<span class="ti-rtype ${r}">${RTYPE[r]}</span>`; };
/* a bordered "label ─ value" chip; value is "—" when unset */
const fieldChip = (label, val, cls="") =>
  `<span class="ti-field ${cls}"><span class="tf-l">${label}</span><span class="tf-v">${esc(val || "—")}</span></span>`;
/* v3.34: 開始時期がまだ先のタスクを一律で後ろに沈める仕様をやめた。
   「優先されないだけであって、後ろに置く仕様にしてほしいわけではない」という
   ユーザー指摘の通り、着手可能かどうかは並び順の判断材料に含めない — 期限が
   他より近ければ、まだ着手できないタスクでも普通に上に来る。開始時期そのものは
   行の中に日付として表示されるので、情報としては残る。 */
const bySingle = (a,b) => prioRank(a) - prioRank(b) || byDue(a,b);
/* タスク一覧の並べ替え（v3.32/v3.34）:
   「重要度順」「期限順」はバケット分けせず全体を1本の軸で並べる。
   v3.93: 同着の並びを明文化。「重要度順」「期限順」それぞれで、期限・重要度が
   同じときの3番目の軸に開始時期を追加し、最後は必ずタスクの登録順で決める
   （名前のあいうえお順だった旧仕様から変更）。開始時期の扱いは軸によって
   意味が違うため、それぞれ専用のタイブレークを用意する:
     - 重要度順側: 「開始可能になった（設定あり・今日以降ではない）」→
       「未設定」→「まだ開始時期前（設定あり・これから）」の3段階
     - 期限順側: 開始時期の設定が「ある」ものを優先して開始時期の早い順に
       並べ、「ない」ものは後ろへ（可否は問わず設定の有無だけで2段階） */
const byDueOnly = (a,b) => (a.due||"9999-99-99").localeCompare(b.due||"9999-99-99");
const byCreated = (a,b) => (a.createdAt||"").localeCompare(b.createdAt||"");
const startBucketForPrio = t => !t.startDate ? 1 : (t.startDate <= todayStr() ? 0 : 2);
const byStartForPrio = (a,b) => startBucketForPrio(a) - startBucketForPrio(b) || (a.startDate||"").localeCompare(b.startDate||"");
const startBucketForDue = t => t.startDate ? 0 : 1;
const byStartForDue = (a,b) => startBucketForDue(a) - startBucketForDue(b) || (a.startDate||"").localeCompare(b.startDate||"");
const byPrioFlat = (a,b) => prioRank(a) - prioRank(b) || byDueOnly(a,b) || byStartForPrio(a,b) || byCreated(a,b);
const byDueFlat = (a,b) => byDueOnly(a,b) || (prioRank(a) - prioRank(b)) || byStartForDue(a,b) || byCreated(a,b);
/* v3.52: 「デフォルト」をアイゼンハワー・マトリクス（重要度×緊急度）の4象限
   グループ分けに変更。重要度は期限＝緊急度と対になる軸。
   重要＝重要度「高」「中」／重要でない＝重要度「無」。
   緊急＝期限が dueBucket 0・1（期限切れ・今日まで／7日以内）、
   緊急でない＝dueBucket 2・3（この先の期限／期限なし）— 既存の期限バケットの
   区切りをそのまま再利用し、アプリ内で「緊急」の感覚を統一する。
   表示順は 第一象限(重要×緊急)→第二象限(重要×緊急でない)→
   第三象限(緊急×重要でない)→第四象限(どちらでもない)。
   v3.53: 例外昇格。第三象限（緊急だが重要でない）のうち、「緊急」の中でも
   dueBucket 1（7日以内だが今日ではない）ではなく dueBucket 0（期限切れ・
   今日まで＝本当に今日中にやらないといけないもの）に限っては、重要度を
   問わず第一象限（今すぐ）に引き上げる。「計画する」ではなく「今すぐ」に
   昇格させるのは、「今すぐ」が指しているのは重要度ではなく「今日中に動く
   必要がある」という緊急性そのものだから（「計画する」は逆に"今日じゃ
   なくていい"というニュアンスを持つため、今日締切のタスクとは意味が
   合わない）。影響が出るのは「重要でない、かつ期限が今日／期限切れ」の
   タスクだけで、重要なタスクや「7日以内だが今日ではない」タスクの扱いは
   従来どおり。 */
const isImportant = t => t.prio==="high" || t.prio==="mid";
const isUrgent = t => dueBucket(t.due) <= 1;
const quadrant = t => {
  if(dueBucket(t.due) === 0) return 0; // 例外昇格: 今日中／期限切れは重要度を問わず「今すぐ」
  const imp = isImportant(t), urg = isUrgent(t);
  if(imp && urg) return 0;    // 第一象限: 今すぐ
  if(imp && !urg) return 1;   // 第二象限: 計画する
  if(!imp && urg) return 2;   // 第三象限: こなす
  return 3;                   // 第四象限: あと回し
};
const QUADRANTS = [[0,"今すぐ"],[1,"計画する"],[2,"こなす"],[3,"あと回し"]];
/* 象限内の並び: 緊急な象限（今すぐ・こなす）は期限優先、
   緊急でない象限（計画する・あと回し）は重要度優先 */
const byQuadrant = (a,b) => {
  const qa = quadrant(a), qb = quadrant(b);
  if(qa !== qb) return qa - qb;
  return (qa===0 || qa===2) ? (byDue(a,b) || prioRank(a)-prioRank(b))
                             : (prioRank(a)-prioRank(b) || byDue(a,b));
};

function weekCount(taskId, ref){
  const ws = weekStart(ref), we = addDays(ws,6);
  return db.occurrences.filter(o=>o.taskId===taskId && o.status==="done" && inRange(o.date,ws,we)).length;
}
function hasOccToday(taskId, d){ return db.occurrences.some(o=>o.taskId===taskId && o.date===d); }
/* v3.122: 「ひと段落」機能用。継続型タスクが頻度目標に対してどれだけ
   後回しになっているかを0〜7のレンジで返す（大きいほど優先）。傾向タブの
   analyze()にはこれに使える既存ロジックが無い（chronicは完了型寄り、
   repeatDayは曜日パターンで緊急度ではない）ため新規に最小限で作る。 */
function skillBacklog(t, date){
  if(t.freq?.type === "perWeek"){
    const n = t.freq.n || 1;
    return Math.max(0, n - weekCount(t.id, date));
  }
  let doneDays = 0;
  for(let i=1; i<=7; i++){
    const d = addDays(date, -i);
    if(db.occurrences.some(o=>o.taskId===t.id && o.date===d && o.status==="done")) doneDays++;
  }
  return 7 - doneDays;
}

/* ============================================================
   ANALYSIS — learn the user's tendencies from past operations only
   (no extra input; everything comes from completed/deferred occurrences)
   ============================================================ */
const median = arr => {
  if(!arr.length) return null;
  const s = [...arr].sort((a,b)=>a-b), m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
};
const BUCKETS = [[0,"0–3時"],[3,"3–6時"],[6,"6–9時"],[9,"9–12時"],[12,"12–15時"],[15,"15–18時"],[18,"18–21時"],[21,"21–24時"]];
const bucketOf = hm => Math.floor(parseInt(hm.split(":")[0],10)/3)*3;

function analyze(){
  const T = todayStr();
  const past = db.occurrences.filter(o => o.date < T);      // finished days only
  const kept = o => o.status==="done";
  const decided = o => kept(o) || o.status==="deferred" || o.status==="skipped" || o.status==="planned"; // past 'planned' = missed

  // --- how much actually gets done in a day ---
  const byDate = {};
  past.forEach(o=>{
    if(o.plan) return;
    const d = (byDate[o.date] = byDate[o.date] || { planCnt:0, doneMin:0, doneCnt:0 });
    if(o.status!=="deferred") d.planCnt++;
    if(kept(o)){ d.doneMin += (o.actualMin||0); d.doneCnt++; }
  });
  const dayStats = Object.values(byDate).filter(d=>d.planCnt>0);
  const daysTracked = dayStats.length;
  const capacityMin = daysTracked>=4 ? Math.round(median(dayStats.map(d=>d.doneMin))) : null;
  const capacityCnt = daysTracked>=4 ? median(dayStats.map(d=>d.doneCnt)) : null;

  // --- estimation bias by category (fully-done only, clean ratio) ---
  const catRatio = {};
  past.forEach(o=>{
    if(o.plan || o.status!=="done" || !o.plannedMin || !o.actualMin) return;
    const c = occCat(o) || "その他";
    (catRatio[c] = catRatio[c] || []).push(o.actualMin / o.plannedMin);
  });
  const estBias = Object.entries(catRatio).filter(([,a])=>a.length>=4)
    .map(([cat,a])=>({ cat, ratio:median(a), n:a.length }))
    .sort((x,y)=>Math.abs(y.ratio-1)-Math.abs(x.ratio-1));

  // --- reliability by time-of-day bucket ---
  const hb = {};
  past.forEach(o=>{
    if(o.plan || !o.plannedStart || !decided(o)) return;
    const b = bucketOf(o.plannedStart);
    const x = (hb[b] = hb[b] || { kept:0, total:0 });
    x.total++; if(kept(o)) x.kept++;
  });
  const hourScores = Object.entries(hb).filter(([,v])=>v.total>=4)
    .map(([b,v])=>({ b:+b, rate:v.kept/v.total, n:v.total })).sort((a,b)=>a.b-b.b);

  // --- reliability by weekday ---
  const wb = {};
  past.forEach(o=>{
    if(o.plan || !decided(o)) return;
    const w = parseDstr(o.date).getDay();
    const x = (wb[w] = wb[w] || { kept:0, total:0 });
    x.total++; if(kept(o)) x.kept++;
  });
  const weekdayScores = Object.entries(wb).filter(([,v])=>v.total>=5)
    .map(([w,v])=>({ w:+w, rate:v.kept/v.total, n:v.total }));

  // --- overall recent completion rate ---
  const dec = past.filter(o=>!o.plan && o.plannedStart && decided(o));
  const overallRate = dec.length>=10 ? dec.filter(kept).length/dec.length : null;

  // --- chronic deferrals: deferred a lot AND rarely finished ---
  const defCnt = {}, doneCnt = {};
  db.occurrences.forEach(o=>{
    if(!o.taskId) return;
    if(o.status==="deferred") defCnt[o.taskId] = (defCnt[o.taskId]||0)+1;
    if(o.status==="done")     doneCnt[o.taskId] = (doneCnt[o.taskId]||0)+1;
  });
  const chronic = Object.entries(defCnt)
    .filter(([id,n]) => n>=4 && n >= (doneCnt[id]||0))
    .map(([id,n]) => { const t = db.tasks.find(x=>x.id===id); return t && !t.done ? { task:t, defers:n, dones:doneCnt[id]||0 } : null; })
    .filter(Boolean).sort((a,b)=>b.defers-a.defers);

  // --- repeat tasks: which weekday they actually happen ---
  const repeatDay = db.tasks.filter(t=>t.kind==="repeat").map(t=>{
    const dc = {};
    db.occurrences.forEach(o=>{ if(o.taskId===t.id && o.status==="done") { const w=parseDstr(o.date).getDay(); dc[w]=(dc[w]||0)+1; } });
    const ent = Object.entries(dc).sort((a,b)=>b[1]-a[1]);
    const total = ent.reduce((s,[,n])=>s+n,0);
    if(total<4) return null;
    const top = ent.filter(([,n])=>n >= ent[0][1]*0.7).map(([w])=>+w);
    const share = top.reduce((s,w)=>s+(dc[w]||0),0)/total;
    return share>=0.55 && top.length<=3 ? { task:t, days:top, share, total } : null;
  }).filter(Boolean);

  return { daysTracked, capacityMin, capacityCnt, estBias, hourScores, weekdayScores, overallRate, chronic, repeatDay };
}

/* today's outlook — will the plan hold? */
function todayOutlook(profile){
  const d = state.date;
  const occ = occsOn(d).filter(o=>!o.plan);
  const pending = occ.filter(o=>o.status==="planned");
  const doneMin = occ.filter(o=>o.status==="done").reduce((s,o)=>s+(o.actualMin||0),0);
  const pendMin = pending.reduce((s,o)=>s+(o.plannedMin || taskOf(o)?.estMin || 0),0);
  const projected = doneMin + pendMin;

  let verdict = null;
  if(profile.capacityMin!=null && pending.length){
    const r = projected / Math.max(profile.capacityMin,1);
    if(r >= 1.4)      verdict = { level:"over",  text:`今日の予定は約 ${projected}分。普段こなせているのは約 ${profile.capacityMin}分です。` };
    else if(r >= 1.1) verdict = { level:"tight", text:`今日の予定は約 ${projected}分。普段（約 ${profile.capacityMin}分）よりやや多めです。` };
    else             verdict = { level:"ok",    text:`今日の予定は約 ${projected}分。普段の範囲（約 ${profile.capacityMin}分）に収まっています。` };
  }

  const risks = [];
  pending.forEach(o=>{
    if(o.plannedStart){
      const hs = profile.hourScores.find(x=>x.b===bucketOf(o.plannedStart));
      if(hs && hs.rate < 0.5)
        risks.push(`${o.plannedStart} の時間帯はこれまで達成率 ${Math.round(hs.rate*100)}%。「${occName(o)}」は前倒しできる?`);
    }
    const cat = occCat(o);
    const eb = profile.estBias.find(x=>x.cat===cat);
    if(eb && eb.ratio >= 1.25){
      const p = o.plannedMin || taskOf(o)?.estMin || 0;
      risks.push(`「${cat}」は見積もりの約 ${eb.ratio.toFixed(1)} 倍かかりがち。「${occName(o)}」は ${p}分 → ${Math.round(p*eb.ratio/5)*5}分 で見ておくと安全。`);
    }
  });

  // heaviest pending task to move, if overloaded
  let moveable = null;
  if(verdict && verdict.level==="over"){
    moveable = pending.filter(o=>o.taskId).sort((a,b)=>
      (b.plannedMin||taskOf(b)?.estMin||0) - (a.plannedMin||taskOf(a)?.estMin||0))[0] || null;
  }
  return { verdict, risks:risks.slice(0,3), moveable, projected };
}

/* ---------- template application ----------
   v3.49: 適用は「コピーして一から追加した」のと同じ状態にする（テンプレへの
   ライブ同期ではない）。予定（tpl.plans）・タスク配置（tpl.tasks）のどちらも、
   適用した瞬間にこの日専用の独立した occurrence として書き出され、以後は
   テンプレを直接読み返さない。あとでテンプレを編集しても、既にコピー済みの
   日には影響しない。タイムテーブル上で予定の文字をタップしても、テンプレ
   編集画面へは飛ばず、この日だけの予定として独立に編集できる（edit-marker）。

   タスク配置（tpl.tasks）は `fromTpl:true` を付け、後の変更/解除と見分ける。
   Each row gets its OWN occurrence — matching is done with a "pool" of this
   day's still-untouched occurrences per taskId, claimed one at a time, so the
   same task placed at two different times (e.g. メール処理 09:00 と 15:00) gets
   two occurrences instead of the second row overwriting the first's.

   For backward compatibility with occurrences created before `fromTpl` existed,
   an occurrence is also eligible to be claimed/adopted (and swept away on a
   later clear) when its taskId is in the PREVIOUSLY-applied template's task
   list for this day — that covers old data with no fromTpl tag at all.

   予定（tpl.plans）は行に安定した識別子がないため、タスクのような「個体を
   維持したまま再整列」はできない。適用のたびにこの日の `fromTpl` 付き予定を
   いったん全部消し、テンプレの現在の内容から作り直す（個別に追加した予定・
   fromTpl の付かないものには一切触れない）。 */
function applyTemplate(d, tplId){
  const tpl = db.templates.find(t=>t.id===tplId);
  if(!tpl) return;
  const prevMeta = db.dayMeta[d];
  const prevTpl = prevMeta && db.templates.find(t=>t.id===prevMeta.templateId);
  const prevTaskIds = prevTpl ? new Set((prevTpl.tasks||[]).map(r=>r.taskId)) : new Set();
  const rows = tpl.tasks || [];

  // v3.109: 完了ずみ（status:"done"）の実施を再利用対象から除外していたため、
  // 同じ日にテンプレートを再適用する（テンプレ編集の保存で「今日の予定に反映」
  // したときなど）たびに、すでに完了した枠のぶんだけ新しい実施が重複して
  // 作られてしまっていた——実際にユーザーのデータで同じ枠が3〜4件に増える
  // 事故が起きた。完了ずみも再利用対象に含め、時刻だけ更新する（完了状態・
  // 実績は変更しない）ようにして、再適用が重複を生まないようにする。
  const pool = {}, donePool = {};
  db.occurrences.forEach(o=>{
    if(o.date!==d || !(o.fromTpl || prevTaskIds.has(o.taskId))) return;
    if(o.status==="planned") (pool[o.taskId] = pool[o.taskId] || []).push(o);
    else if(o.status==="done") (donePool[o.taskId] = donePool[o.taskId] || []).push(o);
  });
  const claimed = new Set();
  rows.forEach(row=>{
    const t = db.tasks.find(x=>x.id===row.taskId);
    if(!t) return;
    const avail = (pool[row.taskId] || []).filter(o=>!claimed.has(o.id));
    if(avail.length){
      // 同じタスクが1日に複数の時間枠にある場合（「水」を1日3回など）、
      // 配列の先頭を無条件に採用すると、既存の枠の時刻とテンプレ行の時刻が
      // 噛み合わず、メモ・実績時間が違う時間枠に付け替わる恐れがある。
      // まず時刻が一致するものを優先し、無ければ従来どおり先頭にフォール
      // バックする（予定=tpl.plansをラベルで対応付けるのと同じ考え方）。
      const ex = avail.find(o=>o.plannedStart===row.time) || avail[0];
      claimed.add(ex.id);
      ex.plannedStart = row.time || null;
      ex.plannedMin = row.mins || ex.plannedMin || null;
      ex.fromTpl = true;   // adopt it into template tracking, whether it already was or not
      return;
    }
    // すでに完了ずみの実施があれば、それを「この枠は既にある」ものとして扱い
    // 新規作成を避ける——完了の記録（実績・完了時刻）はそのまま触らない。
    const doneAvail = (donePool[row.taskId] || []).filter(o=>!claimed.has(o.id));
    if(doneAvail.length){
      claimed.add(doneAvail[0].id);
      doneAvail[0].fromTpl = true;
      return;
    }
    // v3.101: テンプレート適用で完了型タスクの新しい実施ができるときも、
    // 空のnoteで作ると前回の進捗メモがlatestOccOf()から見えなくなる
    // （「add-today」と同じ理由）ため、前回の実施のnoteを引き継ぐ。
    const carryNote = t.kind==="single" ? (latestOccOf(t.id)?.note || "") : "";
    const created = { id:uid(), taskId:row.taskId, date:d,
      plannedStart: row.time || null, plannedMin: row.mins || t.estMin || null,
      actualMin:null, status:"planned", doneAt:null, adhoc:false, title:null, note:carryNote, fromTpl:true };
    db.occurrences.push(created);
    claimed.add(created.id);
  });
  // drop leftover template-tracked (or adoptable-legacy) occurrences that no row
  // claimed — fewer rows than before, a task removed from the template, or a
  // different template entirely
  db.occurrences = db.occurrences.filter(o=>{
    if(!(o.date===d && o.status==="planned") || claimed.has(o.id)) return true;
    return !(o.fromTpl || prevTaskIds.has(o.taskId));
  });

  // 予定（tpl.plans）: テンプレの「今の中身」に合わせて更新する。
  // v3.109: 以前はこの日のfromTpl付き予定を全部消してから作り直していたが、
  // そのたびに新しいidが振られるため、複数端末でそれぞれ独自に適用した結果を
  // クラウド同期（id単位のマージ）で合流させると、同じ「起床」「仕事」などが
  // 際限なく重複してしまっていた（実際にユーザーのデータで確認）。ラベルで
  // 対応する既存の予定を探して再利用し（idを変えない）、見つからないときだけ
  // 新規作成する。
  const planPool = {};
  db.occurrences.forEach(o=>{
    if(o.date===d && o.plan && o.fromTpl) (planPool[o.title||""] = planPool[o.title||""] || []).push(o);
  });
  const planClaimed = new Set();
  // v3.123: freeBlockはテンプレの予定行自体が持つ（sheetMarkerでの日ごとの
  // 手直しだけだと、テンプレを再適用するたびに元の状態に戻ってしまうため）。
  // 再利用・新規作成のどちらでも、その日の実施へ毎回コピーし直す。
  (tpl.plans||[]).forEach(b=>{
    const label = b.label || "";
    const avail = (planPool[label] || []).filter(o=>!planClaimed.has(o.id));
    if(avail.length){
      const ex = avail[0];
      planClaimed.add(ex.id);
      ex.plannedStart = b.time||null; ex.plannedMin = b.mins||null; ex.category = b.category||"その他";
      ex.freeBlock = !!b.freeBlock;
      return;
    }
    const created = { id:uid(), taskId:null, date:d, title:label, plan:true,
      plannedStart:b.time||null, plannedMin:b.mins||null, category:b.category||"その他",
      actualMin:null, status:"plan", doneAt:null, adhoc:false, note:"", fromTpl:true, freeBlock: !!b.freeBlock };
    db.occurrences.push(created);
    planClaimed.add(created.id);
  });
  // 前回はあったが今回のテンプレの中身には無くなった予定（ブロック削除・改名）だけを消す
  db.occurrences = db.occurrences.filter(o=>!(o.date===d && o.plan && o.fromTpl) || planClaimed.has(o.id));

  // tplPlansCopied: この日は予定のコピーずみ、という印。migrate() の一度きりの
  // 補完（後述）が、ユーザーが後でコピーぶんを削除した日を復活させないための目印。
  db.dayMeta[d] = Object.assign({}, db.dayMeta[d], { templateId: tplId, tplPlansCopied: true });
  save();
}

/* テンプレートを外す: テンプレ由来で未着手のタスク実施と、テンプレ由来の予定を消す。
   個別に追加したタスクや予定、すでに完了・一部実施したタスクはそのまま残る。
   「テンプレ由来」の判定はタスクについては fromTpl フラグに加えて、フラグの無い
   古いデータも救うため、外す時点でその日に適用されていたテンプレのタスク一覧に
   taskId が載っているかもフォールバックで見る。予定は v3.49 以降つねに fromTpl
   フラグで判定する（コピーして作られるようになったため）。 */
function clearTemplateForDay(d){
  const meta = db.dayMeta[d];
  const tpl = meta && db.templates.find(t=>t.id===meta.templateId);
  const tplTaskIds = tpl ? new Set((tpl.tasks||[]).map(r=>r.taskId)) : new Set();
  db.occurrences = db.occurrences.filter(o=>{
    if(o.date!==d) return true;
    if(o.plan) return !o.fromTpl;
    if(o.status!=="planned") return true;
    return !(o.fromTpl || tplTaskIds.has(o.taskId));
  });
  if(db.dayMeta[d]){ delete db.dayMeta[d].templateId; delete db.dayMeta[d].tplPlansCopied; }
  save();
}

const H = document.getElementById("header");

/* appearance: one of light / green / dark (green = the original dark palette) */
function applyTheme(){
  const t = ["light","green","dark"].includes(settings().theme) ? settings().theme : "green";
  document.documentElement.dataset.theme = t;
}

// v3.88: 「オンラインに戻ったときなどに画面が壊れる（下のタブバーが
// 見えない）」という報告への対応。以前は render() の途中（ヘッダーや
// 各タブの中身の描画）で例外が起きると、その下にある renderTabbar() が
// 一度も呼ばれず、下部のタブバーごと消えて見える状態になっていた
// （呼び出し元の一番外側の try/catch で握りつぶされ、そこで処理が
// 止まっていたため）。ヘッダー描画・タブの中身描画をそれぞれ個別に
// try/catch で囲み、どちらかが失敗しても残りは必ず実行される（＝
// タブバー自体は必ず出る＝操作不能にはならない）ようにした。中身の
// 描画が失敗した場合は、空白のまま放置せず、再読み込みを促す文言を
// 表示する。
function render(){
  applyTheme();
  try{ renderHeader(); }
  catch(e){ console.error("renderHeader failed", e); }
  try{
    if(state.tab==="today") renderToday();
    else if(state.tab==="tasks") renderTasks();
    else if(state.tab==="history") renderHistory();
    else if(state.tab==="notes") renderNotes();
    else if(state.tab==="templates") renderTemplates();
    else if(state.tab==="settings") renderSettings();
  }catch(e){
    console.error("tab content render failed", e);
    try{ M.innerHTML = `<div class="tl-hint">画面の表示中に問題が起きました。恐れ入りますが、画面を再読み込みしてください。<br>（この端末に保存されているデータ自体は失われていません）</div>`; }catch(e2){}
  }
  // v3.89: renderTabbar() 自体、および直後の FAB 表示制御も、v3.88の時点では
  // 個別の try/catch で囲んでいなかった——つまり renderTabbar() 自身が何らかの
  // 理由で例外を投げると、結局そこで render() 全体が止まり、「タブバーが
  // 消える」バグが直らないまま残ってしまっていた（実際に報告があった）。
  // ここも他の描画ステップと同様に独立させ、どれか1つが失敗しても
  // 残りは必ず実行されるようにする。
  try{ renderTabbar(); }
  catch(e){ console.error("renderTabbar failed", e); }
  try{
    const showFab = state.tab==="today" || state.tab==="tasks" || state.tab==="notes";
    FAB.hidden = !showFab;
    M.classList.toggle("has-fab", showFab);
    if(state.tab!=="today"){ FABM.hidden = true; }   // the FAB menu is a today-only thing
  }catch(e){ console.error("FAB visibility update failed", e); }
}

/* ---------- TODAY (also used to view/fix any past day) ---------- */
function renderToday(){
  const d = state.date;
  const isToday = d === todayStr();
  let html = "";

  if(db.meta && db.meta.sample){
    html += `<div class="banner">サンプルデータで表示中です。<button data-act="clear-sample">消して始める</button></div>`;
  }

  // schedule outlook — only for today ("will today's plan hold?")
  if(isToday && settings().showOutlook !== false){
    const ol = todayOutlook(analyze());
    if(ol.verdict || ol.risks.length){
      html += `<div class="outlook">`;
      if(ol.verdict){
        const jp = {ok:"収まっています",tight:"やや多め",over:"過負荷ぎみ"}[ol.verdict.level];
        html += `<div class="ol-head"><span class="ol-dot ${ol.verdict.level}"></span>今日の見通し — ${jp}</div>
          <div class="ol-text">${esc(ol.verdict.text)}</div>`;
      } else {
        html += `<div class="ol-head"><span class="ol-dot tight"></span>今日の見通し</div>`;
      }
      ol.risks.forEach(r=> html += `<div class="ol-risk">${esc(r)}</div>`);
      html += `</div>`;
    }
  }

  const occ = occsOn(d);
  // 予定 (time context, no check): single-day 予定 occurrences。テンプレ由来のもの
  // （fromTpl 付き）も含めて、すべてこの日専用の独立した occurrence として持つ
  // （v3.49〜。テンプレを直接読み返すことはしない）。右側の帯＋ラベルを作る；カードにはしない。
  const planRows = occ.filter(o=>o.plan).map(o=>({
    block:true, marker:true, id:o.id,
    time:o.plannedStart||"12:00", label:o.title||"(無題)", note:o.note||"",
    mins:o.plannedMin||null, key:timeKey(o.plannedStart||"12:00"),
  }));
  const blockRows = planRows;
  const occRows = occ.filter(o=>o.plannedStart && !o.plan).map(o=>({occ:o,time:o.plannedStart,key:timeKey(o.plannedStart)}));
  const untimed = occ.filter(o=>!o.plannedStart && !o.plan);
  const hasItems = blockRows.length || occRows.length || untimed.length;

  // sub-view: タイムテーブル（時間割） / 今日のタスク（フラットな一覧）
  const view = state.todayView === "list" ? "list" : "timeline";
  const undoneCnt = occ.filter(o=>!o.plan && o.status==="planned").length;
  html += `<div class="seg today-seg view-seg">
    <button class="${view==="timeline"?"on":""}" data-act="today-view" data-v="timeline">タイムテーブル</button>
    <button class="${view==="list"?"on":""}" data-act="today-view" data-v="list">ToDoリスト${undoneCnt?` <span class="seg-badge">${undoneCnt}</span>`:""}</button>
  </div>`;

  if(view === "list"){
    // flat checklist of the day's tasks — no 24h grid, so it never gets buried.
    // order: 未完了（時間未定 → 時間あり）→ 完了（時間未定 → 時間あり）。
    // 時間未定／時間あり は明示的に見出しを分けて出す（並び順だけでなく構造でも分ける）。
    // 予定 (time context) are timeline-only, never shown here.
    const listOcc = occ.filter(o=>!o.plan);
    const doneish = o => o.status==="done" || o.status==="deferred" || o.status==="skipped";
    const byName = (a,b) => occName(a).localeCompare(occName(b),"ja");
    const byTime = (a,b) => timeKey(a.plannedStart) - timeKey(b.plannedStart);
    const pending = listOcc.filter(o=>!doneish(o));
    const settled = listOcc.filter(o=>doneish(o));
    // 切替タブ自体に「ToDoリスト」と出ているので、ここで重ねて見出しは出さない
    if(!listOcc.length){
      html += `<div class="tl-hint">まだ何もありません。右下の＋から追加できます。</div>`;
    } else {
      const renderStatusGroup = (label, items) => {
        if(!items.length) return "";
        const untimed = items.filter(o=>!o.plannedStart).sort(byName);
        const timed = items.filter(o=>o.plannedStart).sort(byTime);
        let h = `<div class="lc-group-label">${label}</div>`;
        if(untimed.length) h += `<div class="lc-subgroup-label">時間未定</div><div class="untimed">${untimed.map(o=>cardHTML(o,true)).join("")}</div>`;
        if(timed.length) h += `<div class="lc-subgroup-label">時間指定</div><div class="untimed">${timed.map(o=>cardHTML(o,true)).join("")}</div>`;
        return h;
      };
      html += renderStatusGroup("未完了", pending);
      html += renderStatusGroup("完了", settled);
    }
    // 予定はタスクではないので、この一覧には出さない（タイムテーブルの方で編集する）
    M.innerHTML = html;
    return;
  }

  // ---- timeline view ----
  // duration "band" — ONLY for non-recorded items (幅を持つ固定ブロック like 仕事,
  // and ad-hoc 目印). Tasks you check off never get a band, even with a duration.
  const spans = [];
  blockRows.forEach(b=>{ if(b.mins) spans.push({ s:b.key, e:b.key+b.mins, kind:"marker" }); });

  // 前日の予定が28:00（＝当日の4:00）を越えて続く場合、当日側にもその続きの
  // 帯（背景ハイライト）を映す（v3.61）。例: 前日22:00〜8時間(＝30:00)の睡眠は
  // 当日側の4:00〜6:00にも続きとして出る。あくまで表示上の続きで、実体の
  // occurrence は前日の日付のまま — 当日側の行はタップしても編集は開かない
  // （編集は前日側の行から行う）。繰り越すのは1日ぶんだけ（2日以上連続で
  // 溢れる場合、その先までは追わない）。
  // v3.62: 帯の一番上にも、他の予定と同じ見た目（タイトル＋開始–終了）で
  // ラベルを出す。`marker:false` にして、通常の「タップで編集」ボタンには
  // ならないただの文字列として表示する（`blocks.forEach` 側の既存の分岐を
  // そのまま流用— b.marker が false なら esc(b.label) だけのプレーン表示）。
  // v3.63: 時間の表示は「このページで見えている分（4:00〜終了）」ではなく
  // 「本来の予定の実時刻（例: 1:00〜8:00）」にする。帯そのものはこれまで
  // 通りページの4:00から描くが、ラベルの時刻は`endFromDur()`で本来の
  // 終了時刻を求め、開始も前日の`plannedStart`をそのまま使う（`carryOverRange`
  // として`blocks.forEach`側に渡し、通常の開始–終了計算を上書きする）。
  const carryBlocks = [];
  occsOn(addDays(d,-1)).filter(o=>o.plan && o.plannedStart && o.plannedMin).forEach(o=>{
    const prevEnd = timeKey(o.plannedStart) + o.plannedMin;
    if(prevEnd > 28*60){
      const overflow = prevEnd - 28*60;
      spans.push({ s:4*60, e:4*60 + overflow, kind:"marker", carryOver:true });
      const realRange = `${o.plannedStart}–${endFromDur(o.plannedStart, o.plannedMin)}`;
      carryBlocks.push({ block:true, marker:false, id:o.id, time:"04:00", label:o.title||"(無題)", note:o.note||"", mins:overflow, key:4*60, carryOverRange:realRange });
    }
  });

  // grid: 04:00 → 28:00 (or later if something runs past midnight-4), one row per hour
  const itemKeys = new Set([...blockRows, ...occRows, ...carryBlocks].map(r=>r.key));
  const endKeys = [
    ...spans.map(sp=>sp.e),
    ...[...blockRows, ...occRows].map(r=>r.key + (r.mins || (r.occ && r.occ.plannedMin) || 0)),
  ];
  const lastHour = Math.min(34, Math.max(28, Math.ceil(Math.max(28*60, ...endKeys) / 60)));
  const ticks = [];
  for(let h=4; h<=lastHour; h++){
    if(itemKeys.has(h*60)) continue;
    ticks.push({ tick:true, label:keyToLabel(h*60), key:h*60 });
  }
  // give every span end its own faint row so the bar has a visible terminus
  [...new Set(spans.map(sp=>sp.e))].forEach(k=>{
    if(![...blockRows, ...occRows].some(r=>r.key===k) && !ticks.some(t=>t.key===k))
      ticks.push({ tick:true, spanEnd:true, label:keyToLabel(k), key:k });
  });
  // current-time line — placed on the day whose 0:00–28:00 window contains "now",
  // so it lands correctly whether you're viewing today or yesterday
  const extra = [];
  {
    const now = new Date(), nowCal = dstr(now), H = now.getHours(), Mn = now.getMinutes();
    let nowKey = null;
    if(nowCal === d)                              nowKey = H*60 + Mn;
    else if(nowCal === addDays(d,1) && H < NIGHT_END_HOUR) nowKey = (H+24)*60 + Mn;
    if(nowKey != null) extra.push({ now:true, label:keyToLabel(nowKey), key:nowKey });
  }
  const timed = [...ticks, ...blockRows, ...occRows, ...carryBlocks, ...extra].sort((a,b)=>a.key-b.key);

  html += `<div class="sec-title">${isToday ? "今日の流れ" : (d < todayStr() ? "この日の予定・実績" : "この日の予定")}</div>`;
  if(!hasItems && !carryBlocks.length){
    html += `<div class="tl-hint">${isToday ? "まだ予定はありません。テンプレートを選ぶか、右下の＋から追加できます。" : "まだ何もありません。右下の＋から追加できます。"}</div>`;
  }

  // group everything by time → one time label per time slot, all cards under it
  const groups = [];
  timed.forEach(row=>{
    const last = groups[groups.length-1];
    if(last && last.key === row.key) last.items.push(row);
    else groups.push({ key: row.key, items:[row] });
  });

  // right-side "band" behind each span: its start row down to its end-time row.
  // 終了側は常にその時刻のドット位置で止める（隣接する予定の有無に関わらず）。
  // 開始側は、同じ行に別の予定の終了が乗っているとき（背中合わせ）だけ下半分に
  // 収め、それ以外は行全体を使う。
  const mid = (grp, sp) => grp && grp.key >= sp.s && grp.key < sp.e;
  // この行に、無関係な実施カード（他のタスクの occ）が乗っているか — 乗っている
  // ときだけ、そのカードと紛らわしくならないようこの行での cap 表示を諦め、
  // 直前の行の is-bot に丸めを任せる
  const hasOccAt = grp => grp && grp.items.some(x=>x.occ);
  const spanBgFor = gi => {
    const k = groups[gi].key, prev = groups[gi-1], next = groups[gi+1];
    const startingHere = sp => sp.s === k;
    const endingHere = sp => sp.e === k;
    return spans.map(sp=>{
      if(endingHere(sp))
        return hasOccAt(groups[gi]) ? "" : `<span class="span-bg span-bg--${sp.kind} is-cap"></span>`;
      if(startingHere(sp)){
        // 前日から繰り越してきた帯（carryOver）は、この日のいちばん上の行が
        // 本当の開始ではない（前日からの続き）ので、丸めた開始キャップは出さず
        // 上端まで届く帯のまま（＝途中から続いているように見せる）
        if(sp.carryOver) return `<span class="span-bg span-bg--${sp.kind}"></span>`;
        // v3.95: 以前はここで「同じ行に別の予定の終了（cap）も乗るか」で
        // is-top-half/is-topを出し分けていたが、is-topもドットを超えない
        // 値に直したことで両者が同じ見た目になったため、常にis-topでよい。
        return `<span class="span-bg span-bg--${sp.kind} is-top"></span>`;
      }
      const inMid = k >= sp.s && k < sp.e;
      if(inMid){
        const top = !mid(prev, sp);
        // 直後の行がこの予定の終了行なら、そちらで必ず cap が出るのでここでは丸めない
        // （ただし終了行に無関係な実施カードが乗っていて cap を出せない場合は例外）
        const capFollows = next && next.key === sp.e && !hasOccAt(next);
        const bot = !mid(next, sp) && !capFollows;
        return `<span class="span-bg span-bg--${sp.kind}${top?" is-top":""}${bot?" is-bot":""}"></span>`;
      }
      return "";
    }).join("");
  };
  html += `<div class="tl">`;
  html += groups.map((g,gi)=>{
    const label = keyToLabel(g.key);
    const occs   = g.items.filter(x=>x.occ).map(x=>x.occ);
    const blocks = g.items.filter(x=>x.block);
    const isNow  = g.items.some(x=>x.now);
    const bars   = spanBgFor(gi);

    if(!occs.length && !blocks.length){
      // bare hour tick, or a lone now-marker
      if(isNow) return `<div class="tl-row now">${bars}<div class="tl-time">${esc(label)}</div><span class="tl-node nowdot"></span><div class="tl-body"><span class="now-line"></span></div></div>`;
      return `<div class="tl-row tick ${g.items.some(x=>x.spanEnd)?"span-end":""}">${bars}<div class="tl-time">${esc(label)}</div><span class="tl-node dot"></span><div class="tl-body"></div></div>`;
    }

    // 状態（完了・一部実施など）はカード側のバッジで示すので、時刻の目印は
    // 実施状況で色やチェックマークに変えない（表示要素を増やさない）
    const nodeCls = "block-node";
    let body = "";
    if(isNow) body += `<span class="now-line" style="margin-bottom:8px"></span>`;
    blocks.forEach(b=>{
      // carryOverRange があれば、そちらを優先（このページで見えている分の
      // 開始–終了ではなく、本来の予定の実時刻を出すため）
      const end = b.carryOverRange ? ` <span class="blk-end">${esc(b.carryOverRange)}</span>`
        : b.mins ? ` <span class="blk-end">${keyToLabel(timeKey(b.time))}–${keyToLabel(timeKey(b.time)+b.mins)}</span>` : "";
      const label = b.marker
        ? `<button class="mk-label" data-act="edit-marker" data-id="${b.id}">${esc(b.label)}</button>`
        : esc(b.label);
      // v3.84: 予定の備考（あれば）を内容の次の行に出す。カード側の進捗メモ等と
      // 違って開閉トグルは無く、常に表示（予定自体の情報量が少ないため）。
      const noteHTML = b.note ? `<div class="mk-note">${esc(b.note)}</div>` : "";
      // v3.95: 帯の開始側（.is-top）を常にドットに揃えたので（上記CSS参照）、
      // タイトルも常にそれに合わせて少し下にずらす（以前は背中合わせの行
      // だけずらしていたが、帯の位置自体を統一したのでタイトル側も統一する）。
      // ただし前日から繰り越した帯（carryOverRange持ち）は、帯自体が
      // 行の一番上から途切れずに続いている（is-topのような丸めた開始
      // キャップを出していない）ので、タイトルはずらさない。
      const isSplitStart = !!b.mins && !b.carryOverRange;
      body += `<div class="tl-blocklabel${isSplitStart?" split-shift":""}">${label}${end}${noteHTML}</div>`;
    });
    if(occs.length) body += `<div class="tl-cards">` + occs.map(o=>cardHTML(o,false)).join("") + `</div>`;

    return `<div class="tl-row multi ${isNow?"now":""}">
      ${bars}
      <div class="tl-time">${esc(label)}</div>
      <span class="tl-node ${nodeCls}"></span>
      <div class="tl-body">${body}</div>
    </div>`;
  }).join("");
  html += `</div>`;

  // (time-undetermined tasks are shown only in the やること list now)

  M.innerHTML = html;
}

function cardHTML(o, listView){
  const t = taskOf(o);
  const min = occMin(o);
  const isSet = ["done","deferred","skipped"].includes(o.status);

  let stateBadge = "";
  // タイムテーブル側（!listView）は完了バッジに所要時間を出さない — タイトルと
  // 状態だけのシンプルな表示にしているため。ToDoリスト側（listView）は
  // 実績が分かるよう引き続き所要時間を添える。
  if(o.status==="done") stateBadge = `<span class="card-state done">完了${(listView && o.actualMin)?` ${o.actualMin}分`:""}</span>`;
  else if(o.status==="deferred") stateBadge = `<span class="card-state deferred">延期</span>`;
  else if(o.status==="skipped") stateBadge = `<span class="card-state">未実施</span>`;
  else if(o.status==="planned") stateBadge = `<span class="card-state todo">未完了</span>`;

  // v3.66: 「完了」「一部実施」「取り消し」ボタンは廃止。ToDoリストでは
  // 状態バッジ自体が完了⇔未完了の切り替えボタンを兼ねる（タップで反転）。
  // v3.84/v3.85: 編集ボタンは状態バッジの左隣に固定。`.card-head-actions`
  // （`margin-left:auto`）で編集ボタン＋状態バッジをひとまとめにして
  // カードヘッダーの右端に寄せているので、タイトルの長さに関係なく
  // 常にこの2つが隣り合ったまま右端に来る（v3.84時点では編集ボタンだけに
  // 個別の位置指定が無く、タイトルの直後＝タイトルが短いと状態バッジから
  // 離れて見えるという不具合があったのをv3.85で修正）。ToDoリスト
  // （listView）でのみ表示、タイムテーブル側には出さない。
  // 枠のサイズは「内側」(padding/font-size)からの逆算ではなく「外側」
  // (width/height)を直接指定する——文字のレンダリング幅を推測する必要が
  // なくなり、サイズ調整が必要なときもこの数値を直接変えるだけで済む。
  // 編集・未達成は同じ外枠サイズにして、文字数（編集=2字／未達成=3字）で
  // 見た目の大きさが揃わなくなるのを防ぐ。
  const chipStyle = "border-color:currentColor;box-sizing:border-box;width:45px;height:21px;padding:0;border-radius:6px;font-size:11px;overflow:hidden;text-overflow:ellipsis";
  const editBtn = `<button class="btn ghost tiny" style="${chipStyle}" data-act="edit-occ" data-id="${o.id}">編集</button>`;

  // v3.133: 「未達成」— 時間が決まっている継続型タスク（朝の水分補給など）は、
  // 時間を過ぎてからまとめてやっても意味がないことがある。見送り(skipped)
  // ステータスを手動でトグルできるようにし、そういう実施に「できなかった」
  // という記録を残せるようにする。既存のdone⇔planned用トグル（toggle-occ-done）
  // と同じ考え方で、skipped⇔planned をトグルする。編集ボタンと状態バッジの
  // 間に固定表示（listViewのみ、編集ボタンと同じ扱い）。
  const unmetBtn = `<button class="btn ghost tiny" style="${chipStyle}" data-act="toggle-occ-unmet" data-id="${o.id}">未達成</button>`;

  // time shown INSIDE the card: full range when a duration is set, otherwise just
  // the start time (only where the card isn't already under a timeline time-label)
  let range = "";
  if(o.plannedStart && o.plannedMin)
    range = `${keyToLabel(timeKey(o.plannedStart))}–${keyToLabel(timeKey(o.plannedStart)+o.plannedMin)} ・ ${fmtDur(o.plannedMin)}`;
  else if(listView && o.plannedStart)
    range = keyToLabel(timeKey(o.plannedStart));
  const meta = [
    range ? "" : (min ? `${min}分` : ""),
    o.adhoc ? "予定外" : "",
  ].filter(Boolean).join(" ・ ");

  // v3.66: 一部実施の廃止に伴い、「編集」のメモ（o.note）が進捗記録の代わりになる。
  // タスク自体の固定メモ（t.note）と、この実施だけの進捗メモ（o.note）は
  // 同じ「メモ」トグルで一緒に開閉する（デフォルトは閉じたまま）。
  const note = (t && t.note) ? t.note : "";
  const progressNote = o.note || "";
  const hasNote = !!(note || progressNote);
  const noteOpen = hasNote && state._noteOpen && state._noteOpen.has(o.id);

  // v3.67: v3.66でカテゴリと一緒に重要度/開始/期限まで消してしまっていたのを
  // 修正——消してよかったのはカテゴリだけで、重要度/開始/期限は残す指示
  // だった。タスクタブと同じチップをカテゴリ抜きの3列（grid3）で出す
  // （完了型タスクのみ。継続型・予定にはこれらの項目自体が無い）。
  const metaChips = (t && t.kind==="single")
    ? `<div class="ti-meta grid3"><span class="tf-prio">${prioChip(t)}</span>${fieldChip("開始", mdShort(t.startDate, t.startPrec))}${fieldChip("期限", mdShort(t.due, t.duePrec), dueClass(t.due))}</div>`
    : "";

  // タイムテーブル（!listView）はタイトルとステータスだけのシンプル表示にする。
  // カテゴリ・時間の範囲・メモなどの詳細は「今日のタスク」一覧側でだけ見せる。
  // ToDoリスト側の状態バッジはタップで完了⇔未完了を切り替える。
  // タイムテーブル側の状態表示は、タップすると「今日のタスク」一覧の該当カードへ飛べる
  // ボタンにする（一覧側はもう飛ぶ必要がないので切り替え専用）。
  const statusHTML = !stateBadge ? "" : listView
    ? `<button class="card-status" data-act="toggle-occ-done" data-id="${o.id}">${stateBadge}</button>`
    : `<button class="card-status" data-act="goto-task-in-list" data-id="${o.id}">${stateBadge}</button>`;
  const highlight = state._highlightOccId === o.id;
  return `<div class="card ${isSet?"is-set":""}${highlight?" flash-highlight":""}" id="occ-${o.id}">
    <div class="card-head">
      <span class="card-title">${esc(occName(o))}</span>
      <span class="card-head-actions">${listView ? editBtn + unmetBtn : ""}${statusHTML}</span>
    </div>
    ${listView ? `<div class="card-meta">
      ${metaChips}
      ${range?`<span>${esc(range)}</span>`:""}
      ${meta?`<span>${esc(meta)}</span>`:""}
      ${hasNote?`<button class="note-toggle" data-act="toggle-note" data-id="${o.id}">メモ ${noteOpen?"▲":"▼"}</button>`:""}
    </div>` : ""}
    ${listView && noteOpen && note?`<div class="card-note">${esc(note)}</div>`:""}
    ${listView && noteOpen && progressNote?`<div class="card-onote">${esc(progressNote)}</div>`:""}
  </div>`;
}

/* ---------- TASKS ---------- */
function renderTasks(){
  const d = state.date;
  const repeats = db.tasks.filter(t=>t.kind==="repeat");
  const singlesOpen = db.tasks.filter(t=>t.kind==="single" && !t.done);

  const view = (state.tasksView === "repeat" || state.tasksView === "remarks") ? state.tasksView : "single";
  let html = "";

  // 完了型 / 継続型 / 覚え書き の切り替えタブ（スクロールしても上に残る）
  // v3.97: 「覚え書き」はメモ（db.notes）とは別の独立データ（db.remarks）を
  // 持つ3つ目の切替。ユーザーの指示で「スケジュールかタスクの中のタブに
  // 追加してほしい」「もともとあるメモとは別物」となったため、ここに追加。
  html += `<div class="seg today-seg">
    <button class="${view==="single"?"on":""}" data-act="tasks-view" data-v="single">完了型タスク${singlesOpen.length?` <span class="seg-badge">${singlesOpen.length}</span>`:""}</button>
    <button class="${view==="repeat"?"on":""}" data-act="tasks-view" data-v="repeat">継続型タスク${repeats.length?` <span class="seg-badge">${repeats.length}</span>`:""}</button>
    <button class="${view==="remarks"?"on":""}" data-act="tasks-view" data-v="remarks">覚え書き${db.remarks.length?` <span class="seg-badge">${db.remarks.length}</span>`:""}</button>
  </div>`;

  if(view === "remarks"){
    if(!db.remarks.length){
      html += `<div class="tasklist"><div class="empty">覚え書きはまだありません。右下の＋から追加できます。</div></div>`;
    } else {
      // v3.103: 表示すべきもの（表示期間内。設定していなければ常に対象）から
      // 先に並べ、重要度（完了型タスクと同じ高/中/無）で並べる。表示期間外の
      // ものは下に送る。
      // v3.105: 未設定のものも含め表示期間のキャプションを常に同じ書式で出す
      // （未設定側は「指定なし」）。表示期間外は薄くするだけでなく、完了型
      // タスクの4象限のような`.due-head`の見出し「表示期間外」で仕分ける。
      const remarkRow = r => {
        const periodLabel = (!r.showFrom && !r.showTo)
          ? "表示期間: 指定なし"
          : `表示期間: ${r.showFrom?mdShort(r.showFrom):"指定なし"}〜${r.showTo?mdShort(r.showTo):"指定なし"}`;
        return `<button class="remark-item${remarkInPeriod(r)?"":" rm-dim"}" data-act="edit-remark" data-id="${r.id}">
          <span class="rm-text">${esc(r.text)}</span>
          <div class="rm-meta">
            ${prioChip(r)}
            <span class="rm-date">${periodLabel}</span>
          </div>
        </button>`;
      };
      const items = [...db.remarks].sort(byRemarkShow);
      const inItems = items.filter(remarkInPeriod);
      const outItems = items.filter(r=>!remarkInPeriod(r));
      html += inItems.map(remarkRow).join("");
      if(outItems.length){
        html += `<div class="due-head">表示期間外<span>${outItems.length}</span></div>`;
        html += outItems.map(remarkRow).join("");
      }
    }
  } else if(view === "single"){
    // meta row: 重要度 / 開始 / 期限 / カテゴリ を位置固定で並べる（未設定でも左詰めしない）
    // v3.66: ToDoリストのカードと同じメモタブ（タスク自体のメモ＋実施の
    // 進捗メモを1つのトグルで開閉）を2行目に追加。進捗メモは実施
    // （occurrence）の note を直接読み書きする — ToDoリストのカードの編集画面と
    // 完全に同じデータなので、どちらで書いても連動する。
    // v3.100: 「今日の実施」限定だと、今日まだ置いていない残タスクは前回
    // どこまでやったかがタスクタブから分からず、履歴タブまで探しに行く
    // 必要があった。一番新しい実施（`latestOccOf`）を見るように変更し、
    // 今日以外の日の分なら「M/D時点」の日付ラベルを添えて区別する。
    // <button> だと中にもう1つ <button>（メモトグル）を入れられないため、
    // 行全体を <div data-act="edit-task"> にして、クリック委譲はそのまま活かす
    // （メモトグル自身がタップされた時はそちらの data-act が優先される）。
    const singleRow = t => {
      const latestOcc = latestOccOf(t.id);
      const note = t.note || "";
      const progressNote = latestOcc?.note || "";
      const progressIsToday = latestOcc?.date === todayStr();
      const hasNote = !!(note || progressNote);
      const noteOpen = hasNote && state._noteOpen && state._noteOpen.has(t.id);
      return `<div class="task-item" data-act="edit-task" data-id="${t.id}">
        <div style="flex:1;min-width:0">
          <div class="ti-name">${esc(t.name)}</div>
          <div class="ti-meta-row">
            <div class="ti-meta grid4">
              <span class="tf-prio">${prioChip(t)}</span>
              ${fieldChip("開始", mdShort(t.startDate, t.startPrec))}
              ${fieldChip("期限", mdShort(t.due, t.duePrec), dueClass(t.due))}
              <span class="ti-cat">${esc(t.category||"—")}</span>
            </div>
            ${hasNote?`<button class="note-toggle" data-act="toggle-note" data-id="${t.id}">メモ ${noteOpen?"▲":"▼"}</button>`:""}
          </div>
          ${noteOpen && note?`<div class="card-note">${esc(note)}</div>`:""}
          ${noteOpen && progressNote?`<div class="card-onote">${progressIsToday?"":`<span class="po-date">${esc(fmtDateShort(latestOcc.date))}時点：</span>`}${esc(progressNote)}</div>`:""}
        </div>
      </div>`;
    };
    const sort = ["default","prio","due"].includes(state.taskSort) ? state.taskSort : "default";
    html += `<div style="display:flex;align-items:center;gap:8px;margin:2px 0 8px">
      <span style="font-size:12px;color:var(--muted)">並び順</span>
      <div class="seg" style="margin:0">
        <button class="${sort==="default"?"on":""}" data-act="task-sort" data-v="default">デフォルト</button>
        <button class="${sort==="prio"?"on":""}" data-act="task-sort" data-v="prio">重要度順</button>
        <button class="${sort==="due"?"on":""}" data-act="task-sort" data-v="due">期限順</button>
      </div>
    </div>`;
    if(!singlesOpen.length){
      html += `<div class="tasklist"><div class="empty">完了型タスクはまだありません。右下の＋から追加できます。</div></div>`;
    } else if(sort !== "default"){
      // 重要度順・期限順: 期限バケットでは区切らず、1本の軸で並べる
      const items = [...singlesOpen].sort(sort==="prio" ? byPrioFlat : byDueFlat);
      html += `<div class="tasklist">` + items.map(singleRow).join("") + `</div>`;
    } else {
      // デフォルト: 重要度×緊急度の4象限（アイゼンハワー・マトリクス）でグループ分け
      const present = QUADRANTS.filter(([q]) => singlesOpen.some(t=>quadrant(t)===q));
      present.forEach(([q,lab])=>{
        const items = singlesOpen.filter(t=>quadrant(t)===q).sort(byQuadrant);
        html += `<div class="due-head">${lab}<span>${items.length}</span></div>`;
        html += `<div class="tasklist">` + items.map(singleRow).join("") + `</div>`;
      });
    }
    // v3.99: 「完了ずみ」の折りたたみ一覧は廃止。過去の完了結果は履歴タブ
    // （＞この日を編集）で日付つきで確認・修正できるため、タスクタブに
    // 日付なしのフラットな一覧を別途持つ価値が薄く、際限なく蓄積もして
    // いた（ユーザーの指摘による）。
  } else {
    const repeatRow = t => {
      let badge = "";
      if(t.freq?.type==="perWeek"){
        const c = weekCount(t.id,d);
        badge = `<span class="ti-freq ${c>=t.freq.n?"met":""}">今週 ${c}/${t.freq.n}</span>`;
      } else {
        badge = `<span class="ti-freq">毎日</span>`;
      }
      return `<button class="task-item" data-act="edit-task" data-id="${t.id}">
        <div style="flex:1;min-width:0">
          <div class="ti-name">${esc(t.name)}</div>
          <div class="ti-meta">${rtypeChip(t)}${badge}<span class="ti-cat">${esc(t.category||"—")}</span></div>
        </div>
      </button>`;
    };
    // v3.93: 種類のグループ順を「ルーティン→スキル」に変更（旧: スキル→ルーティン）。
    // 各グループ内は登録が古い順（createdAtの昇順）に明示的に並べる。
    const rtypeGroups = [["routine","ルーティン"],["skill","スキル"]];
    const present = rtypeGroups.filter(([key])=>repeats.some(t=>(t.rtype||"routine")===key));
    html += present.map(([key,label])=>{
      const items = repeats.filter(t=>(t.rtype||"routine")===key).sort(byCreated);
      return `<div class="due-head">${label}<span>${items.length}</span></div><div class="tasklist">${items.map(repeatRow).join("")}</div>`;
    }).join("") || `<div class="tasklist"><div class="empty">継続型タスクはまだありません。右下の＋から追加できます。</div></div>`;
  }

  M.innerHTML = html;
}

/* ---------- HISTORY ---------- */
// v3.98: 「傾向」タブを独立させず、履歴タブの中の切り替え（記録／傾向）に
// まとめた——全体のタブ数を減らしたいというユーザーの指示による。
function renderHistory(){
  const view = state.histView === "insights" ? "insights" : "records";
  const viewSeg = `<div class="seg today-seg">
    <button class="${view==="records"?"on":""}" data-act="hist-view" data-v="records">記録</button>
    <button class="${view==="insights"?"on":""}" data-act="hist-view" data-v="insights">傾向</button>
  </div>`;

  if(view === "insights"){
    M.innerHTML = viewSeg + insightsHTML();
    return;
  }

  const span = state.histSpan;                    // "day" | "week" | "month"
  const ref  = state.histDate || todayStr();
  const T    = todayStr();

  let a, b, label;
  if(span==="day"){ a = b = ref; label = fmtDateJP(ref); }
  else if(span==="week"){ a = weekStart(ref); b = addDays(a,6); label = `${fmtDateShort(a)} 〜 ${fmtDateShort(b)}`; }
  else { const dt = parseDstr(ref); a = dstr(new Date(dt.getFullYear(),dt.getMonth(),1)); b = dstr(new Date(dt.getFullYear(),dt.getMonth()+1,0)); label = `${dt.getFullYear()}年${dt.getMonth()+1}月`; }

  // can we move forward (not past the current period)?
  let canFwd;
  if(span==="day") canFwd = ref < T;
  else if(span==="week") canFwd = weekStart(ref) < weekStart(T);
  else { const r = parseDstr(ref), n = parseDstr(T); canFwd = (r.getFullYear()*12+r.getMonth()) < (n.getFullYear()*12+n.getMonth()); }

  // ---- day blocks ----
  const dayBlock = (day, showHeader) => {
    const list = db.occurrences.filter(o=>o.date===day && !o.plan);
    const done = list.filter(o=>o.status==="done");
    const skip = list.filter(o=>o.status==="skipped");
    const grp = (items,cls,mark,lab)=> items.length ? `<div class="hist-grp"><div class="hg-label">${lab}</div>` +
      items.map(o=>`<div class="hist-row ${cls}"><span class="hr-mark">${mark}</span><span>${esc(occName(o))}${o.note?` <span class="hr-note">— ${esc(o.note)}</span>`:""}</span>${o.actualMin?`<span class="hr-min">${o.actualMin}分</span>`:""}</div>`).join("") + `</div>` : "";
    return `<div class="hist-day">${showHeader?`<div class="hist-h"><span>${esc(fmtDateShort(day))}</span><button class="hn-edit" data-act="edit-day" data-v="${day}">この日を編集 ›</button></div>`:""}`
      + grp(done,"","✓","完了") + grp(skip,"skipped","—","未実施")
      + `</div>`;
  };

  const days = [...new Set(db.occurrences.filter(o=>inRange(o.date,a,b) && !o.plan &&
      ["done","skipped"].includes(o.status)).map(o=>o.date))].sort().reverse();

  let bodyHtml;
  if(span==="day"){
    const mins = db.occurrences.filter(o=>o.date===ref && o.status==="done")
      .reduce((s,o)=>s+(o.actualMin||0),0);
    bodyHtml = `<div class="hist-h" style="border:none;padding:0;margin:0 2px 8px"><span>合計 ${mins} 分</span><button class="hn-edit" data-act="edit-day" data-v="${ref}">この日を編集 ›</button></div>`
      + (days.length ? dayBlock(ref,false) : `<div class="empty">この日の記録はまだありません。</div>`);
  } else {
    // ---- period summary FIRST (so a long month doesn't hide it) ----
    const rows = db.occurrences.filter(o=> inRange(o.date,a,b) && !o.plan && o.status==="done");
    const byCat = {};
    rows.forEach(o=>{ const c = occCat(o) || "その他"; (byCat[c] = byCat[c] || {count:0,min:0}); byCat[c].count++; byCat[c].min += (o.actualMin||0); });
    const cats = Object.entries(byCat).sort((x,y)=>y[1].min-x[1].min);
    const maxMin = Math.max(1, ...cats.map(c=>c[1].min));
    const totMin = rows.reduce((s,o)=>s+(o.actualMin||0),0);

    const doneSingles = db.occurrences.filter(o=>{ const t = taskOf(o); return o.status==="done" && t && t.kind==="single" && inRange(o.date,a,b); });

    let sum = `<div class="sec-title" style="margin-top:4px">この期間のまとめ</div><div class="rollup">`;
    sum += cats.length ? cats.map(([c,v])=>`<div class="rollup-row">
        <span class="rl-cat">${esc(c)}</span>
        <span class="rl-bar"><i style="width:${Math.round(v.min/maxMin*100)}%"></i></span>
        <span class="rl-val">${v.count}回 / ${v.min}分</span>
      </div>`).join("") + `<div class="rollup-row" style="border-top:1px solid var(--hairline);margin-top:4px;padding-top:7px">
        <span class="rl-cat" style="font-weight:600">合計</span><span></span>
        <span class="rl-val">${rows.length}回 / ${totMin}分</span></div>`
      : `<div class="empty" style="border:none;padding:10px 0">まだ集計できる記録がありません。</div>`;
    sum += `</div>`;
    if(doneSingles.length){
      sum += `<div class="rollup"><div class="hg-label">この期間に完了したタスク</div>`;
      sum += doneSingles.map(o=>`<div class="hist-row"><span class="hr-mark">✓</span><span>${esc(occName(o))}</span></div>`).join("");
      sum += `</div>`;
    }

    const daysHtml = days.length ? days.map(d=>dayBlock(d,true)).join("")
      : `<div class="empty">この期間の記録はまだありません。</div>`;

    bodyHtml = sum + `<div class="sec-title">日ごと</div>` + daysHtml;
  }

  const seg = `<div class="seg">` + [["day","日"],["week","週"],["month","月"]].map(([k,l])=>
    `<button class="${span===k?"on":""}" data-act="span" data-v="${k}">${l}</button>`).join("") + `</div>`;

  const nav = `<div class="hist-nav">
      <button class="hn-btn" data-act="hist-step" data-v="-1" aria-label="前へ">‹</button>
      <span class="hn-label">${esc(label)}</span>
      <button class="hn-btn" data-act="hist-step" data-v="1" aria-label="次へ" ${canFwd?"":"disabled"}>›</button>
    </div>`;

  M.innerHTML = viewSeg + seg + nav + bodyHtml;
}

/* ---------- INSIGHTS (傾向) ----------
   v3.98: 独立タブから履歴タブ内の切り替えに変更したのに合わせ、
   M.innerHTML への直接代入をやめてhtml文字列を返すだけの関数にした
   （renderHistory() 側で「記録／傾向」の切り替えセグメントと連結する）。 */
function insightsHTML(){
  const p = analyze();
  const pct = r => Math.round(r*100);
  const barCls = r => r < 0.45 ? "low" : r < 0.7 ? "mid" : "";
  let html = `<p class="ins-intro">毎日の完了・延期などの操作から傾向を学習しています。記録が増えるほど正確になります。</p>`;

  if(p.daysTracked < 3){
    html += `<div class="ins-card"><h3>まだ学習中</h3>
      <p>記録のある日: <strong>${p.daysTracked}日</strong>。あと数日分たまると、こなせる量・時間帯のクセ・先延ばしの傾向を出せます。</p>
      <p>今すぐ動きを見たい場合は、設定 → リセット でサンプルデータ（約4週間分）に戻せます。</p></div>`;
    return html;
  }

  // 1. capacity
  if(p.capacityMin!=null){
    html += `<div class="ins-card"><h3>1日にこなせる量</h3>
      <p>実際にこなせているのは <strong>だいたい ${p.capacityMin}分 / ${Math.round(p.capacityCnt)}件</strong>（記録のある ${p.daysTracked}日の中央値）。</p>
      <p class="ins-note">今日の予定がこれを大きく超えていると、後半が崩れやすくなります。「今日」画面の見通しでも表示されます。</p></div>`;
  }

  // 2. time-of-day reliability
  if(p.hourScores.length >= 2){
    const best = [...p.hourScores].sort((a,b)=>b.rate-a.rate)[0];
    const worst = [...p.hourScores].sort((a,b)=>a.rate-b.rate)[0];
    html += `<div class="ins-card"><h3>時間帯ごとの達成率</h3>`;
    p.hourScores.forEach(h=>{
      const lbl = BUCKETS.find(x=>x[0]===h.b)[1];
      html += `<div class="ins-bar"><span>${lbl}</span>
        <span class="ib-track"><i class="${barCls(h.rate)}" style="width:${Math.max(4,pct(h.rate))}%"></i></span>
        <span>${pct(h.rate)}%</span></div>`;
    });
    if(worst.rate < 0.55 && best.rate - worst.rate >= 0.2)
      html += `<p class="ins-note">${BUCKETS.find(x=>x[0]===worst.b)[1]}に置いたタスクはこれまで達成率 ${pct(worst.rate)}%。重いものは ${BUCKETS.find(x=>x[0]===best.b)[1]}（${pct(best.rate)}%）に寄せると崩れにくいです。</p>`;
    html += `</div>`;
  }

  // 3. weekday reliability
  if(p.weekdayScores.length >= 3){
    html += `<div class="ins-card"><h3>曜日ごとの達成率</h3>`;
    p.weekdayScores.sort((a,b)=>a.w-b.w).forEach(d=>{
      html += `<div class="ins-bar"><span>${WD[d.w]}曜</span>
        <span class="ib-track"><i class="${barCls(d.rate)}" style="width:${Math.max(4,pct(d.rate))}%"></i></span>
        <span>${pct(d.rate)}%</span></div>`;
    });
    const worst = [...p.weekdayScores].sort((a,b)=>a.rate-b.rate)[0];
    if(worst.rate < 0.55) html += `<p class="ins-note">${WD[worst.w]}曜は崩れやすい傾向（${pct(worst.rate)}%）。予定を少なめにしておくと安全です。</p>`;
    html += `</div>`;
  }

  // 4. estimation bias
  if(p.estBias.length){
    html += `<div class="ins-card"><h3>見積もりのクセ</h3>`;
    p.estBias.forEach(e=>{
      const msg = e.ratio >= 1.2 ? `見積もりの約 <strong>${e.ratio.toFixed(1)}倍</strong>かかりがち`
                : e.ratio <= 0.8 ? `見積もりより <strong>短め</strong>に終わりがち（約 ${e.ratio.toFixed(1)}倍）`
                : `ほぼ見積もりどおり`;
      html += `<p>「${esc(e.cat)}」は ${msg}<span style="color:var(--faint)">（${e.n}回）</span></p>`;
    });
    const worst = p.estBias.find(e=>e.ratio>=1.25);
    if(worst) html += `<p class="ins-note">「${esc(worst.cat)}」のタスクは、目安時間を今より ${Math.round((worst.ratio-1)*100)}% ほど長めに取ると予定がずれにくいです。</p>`;
    html += `</div>`;
  }

  // 5. chronic deferrals
  if(p.chronic.length){
    html += `<div class="ins-card"><h3>よく先延ばしになるタスク</h3>`;
    p.chronic.forEach(c=>{
      html += `<p>「${esc(c.task.name)}」— <strong>${c.defers}回</strong>先送り${c.dones?`（完了は${c.dones}回）`:"、まだ完了なし"}</p>`;
    });
    html += `<p class="ins-note">小さく分ける・時間を変える・思い切って一覧から外す、のどれかを検討すると予定が軽くなります。</p></div>`;
  }

  // 6. repeat-task weekday pattern
  if(p.repeatDay.length){
    html += `<div class="ins-card"><h3>継続型タスクの実施曜日</h3>`;
    p.repeatDay.forEach(r=>{
      html += `<p>「${esc(r.task.name)}」は <strong>${r.days.map(w=>WD[w]).join("・")}曜</strong> に実施しがち（実施の${pct(r.share)}%）</p>`;
    });
    html += `<p class="ins-note">この曜日にあらかじめ置いておくと、頻度を満たしやすくなります。</p></div>`;
  }

  html += `<p class="ins-intro" style="margin-top:16px">「今日」画面の見通しカードは 設定 → 「今日の見通しを表示」で切り替えられます。</p>`;
  return html;
}

/* readable text dump of every still-open task (タスクタブに出るもの) — for keeping
   a plain-text copy outside the app */
function openTasksText(){
  const repeats = db.tasks.filter(t=>t.kind==="repeat");
  const singles = db.tasks.filter(t=>t.kind==="single" && !t.done).slice().sort(bySingle);
  const freqTxt = t => t.freq?.type==="daily" ? "毎日" : t.freq?.type==="perWeek" ? `週${t.freq.n}回` : "";
  const line = t => {
    const bits = [t.category || "その他"];
    if(t.kind==="repeat" && freqTxt(t)) bits.push(freqTxt(t));
    if(t.estMin) bits.push(`目安${t.estMin}分`);
    if(t.kind==="single" && t.prio && t.prio!=="low") bits.push(`重要${PRIO[t.prio]}`);
    if(t.kind==="single" && t.startDate) bits.push(`着手 ${dateLabel(t.startDate, t.startPrec)}`);
    if(t.kind==="single" && t.due) bits.push(`期限 ${dateLabel(t.due, t.duePrec)}`);
    let s = `- ${t.name}  （${bits.join(" / ")}）`;
    if(t.note) s += `\n    メモ: ${String(t.note).replace(/\s*\n\s*/g," ")}`;
    return s;
  };
  const bucketLab = ["期限切れ・今日まで","7日以内","この先の期限","期限なし"];
  let out = `LifeCore 未完了タスク一覧\n`;
  out += `書き出し: ${new Date().toLocaleString()}  （アプリ v${APP_VERSION}）\n`;
  out += `※ これは読みやすさ用の控えです。まるごと復元するときは、設定「バックアップ（書き出し）」の\n`;
  out += `   JSON を設定「読み込み」に貼り付けてください。\n`;
  out += `\n== 完了型（未完了 ${singles.length} 件）==\n`;
  if(!singles.length) out += `（なし）\n`;
  else [0,1,2,3].forEach(bk=>{
    const items = singles.filter(t=>dueBucket(t.due)===bk);
    if(items.length) out += `\n[${bucketLab[bk]}]\n` + items.map(line).join("\n") + "\n";
  });
  out += `\n== 継続型（${repeats.length} 件）==\n`;
  out += repeats.length ? repeats.map(line).join("\n") + "\n" : "（なし）\n";
  return out;
}

/* ---------- NOTES (自由メモ。タイトル欄が空なら本文の先頭行を使う) ---------- */
const noteHasTitle = n => !!(n.title && n.title.trim());
const noteTitle = n => {
  if(noteHasTitle(n)) return n.title.trim().slice(0,80);
  const first = (n.body || "").split("\n").find(l => l.trim());
  return first ? first.trim().slice(0,80) : "無題";
};
const notePreview = n => {
  const lines = (n.body || "").split("\n").map(l=>l.trim()).filter(Boolean);
  // タイトル欄があるなら本文をそのまま、なければ先頭行はタイトル扱いなので飛ばす
  return lines.slice(noteHasTitle(n) ? 0 : 1).join("  ").slice(0,140);
};
const fmtWhen = iso => {
  if(!iso) return "";
  const dt = new Date(iso), now = new Date();
  if(dt.toDateString() === now.toDateString()) return `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  const y = dt.getFullYear() !== now.getFullYear() ? `${dt.getFullYear()}/` : "";
  return `${y}${dt.getMonth()+1}/${dt.getDate()}`;
};

let noteTimer = null;
function scheduleNoteSave(){ clearTimeout(noteTimer); noteTimer = setTimeout(()=>{ noteTimer = null; save(); }, 500); }
function flushNoteSave(){ if(noteTimer){ clearTimeout(noteTimer); noteTimer = null; save(); } }
function newNote(){
  const iso = new Date().toISOString();
  const n = { id:uid(), title:"", body:"", createdAt:iso, updatedAt:iso };
  db.notes.unshift(n);
  state.noteId = n.id;
  save(); render();
  const ti = document.getElementById("noteTitle");
  if(ti) ti.focus();
}

function renderNotes(){
  const list = [...(db.notes || [])].sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const open = state.noteId ? list.find(n=>n.id===state.noteId) : null;
  if(state.noteId && !open) state.noteId = null;   // it was deleted

  if(open){
    M.innerHTML = `<div class="note-editor">
      <div class="ne-meta"><span>更新 ${esc(fmtWhen(open.updatedAt))}</span>
        <button class="ne-del" data-act="del-note" data-id="${open.id}">削除</button></div>
      <input id="noteTitle" class="ne-title" placeholder="タイトル（空なら本文の先頭行）" value="${esc(open.title || "")}">
      <textarea id="noteBody" placeholder="本文">${esc(open.body || "")}</textarea>
    </div>`;
    return;
  }

  let html = `<div class="sec-title">メモ${list.length?`（${list.length}）`:""}</div>`;
  if(!list.length){
    html += `<div class="empty">メモはまだありません。右下の ＋ から作成できます。</div>`;
  } else {
    html += list.map(n=>`<button class="note-item" data-act="open-note" data-id="${n.id}">
      <div class="nt-title">${esc(noteTitle(n))}</div>
      ${notePreview(n) ? `<div class="nt-prev">${esc(notePreview(n))}</div>` : ""}
      <div class="nt-date">${esc(fmtWhen(n.updatedAt))}</div>
    </button>`).join("");
  }
  M.innerHTML = html;
}

/* テンプレート編集の下書き。編集中はここだけを書き換え、「保存」を押すまで
   db.templates（＝他画面が読む実データ）には反映しない。 */
function getTplDraft(tpl){
  if(!tpl) return null;
  if(!state._tplDraft || state._tplDraft.tplId !== tpl.id){
    state._tplDraft = {
      tplId: tpl.id,
      name: tpl.name,
      plans: JSON.parse(JSON.stringify(tpl.plans || [])),
      tasks: JSON.parse(JSON.stringify(tpl.tasks || [])),
    };
  }
  return state._tplDraft;
}

/* ---------- TEMPLATES (独立画面。スケジュール画面の日付行のショートカットからのみ入る。
   設定画面には含めない — 設定とテンプレートは別々の画面にする) ---------- */

  const tplId = state.settingsTplId || db.templates[0]?.id;

  let html = "";

  html += `<p class="ins-intro">その日に選ぶだけで、いつもの<strong>予定</strong>（仕事・睡眠などの時間の文脈）と、<strong>配置ずみのタスク</strong>（食事など）がまとめて入ります。いくつでも作れます。</p>`;
  html += `<div class="tpl-pick">
    ${db.templates.map(t=>`<button class="btn ${t.id===tplId?"primary":""}" data-act="set-tpl" data-id="${t.id}">${esc(t.name)}</button>`).join("")}
    <button class="btn" data-act="tpl-new">＋ テンプレートを追加</button>
  </div>`;
  if(tpl){

    const draft = getTplDraft(tpl);

      <button class="${tv==="timeline"?"on":""}" data-act="tpl-view" data-v="timeline">タイムライン</button>

    if(tv === "timeline"){
      const rows = [
        ...(draft.plans||[]).map(b=>({ kind:"plan", time:b.time, label:b.label, mins:b.mins||null })),
        ...(draft.tasks||[]).map(r=>({ kind:"task", time:r.time, label:nameOf(r.taskId), mins:r.mins||null })),
      ].sort((a,b)=>timeKey(a.time)-timeKey(b.time));
      html += `<div class="tpl-preview" style="font-weight:600;font-size:13px;margin-top:8px">${esc(draft.name)}</div>`;

        html += `<div class="tl-hint">行がありません。「編集」で追加してください。</div>`;
      } else {
        html += `<div class="tl" style="margin-top:8px">`;
        rows.forEach(b=>{
          const k = timeKey(b.time);
          const end = b.mins ? ` <span class="blk-end">${keyToLabel(k)}–${keyToLabel(k+b.mins)} ・ ${fmtDur(b.mins)}</span>` : "";
          const tag = b.kind==="task" ? ` <span class="tpl-rec-tag">タスク</span>` : "";
          html += `<div class="tl-row"><div class="tl-time">${esc(keyToLabel(k))}</div><span class="tl-node block-node"></span><div class="tl-body"><span class="tl-blocklabel">${esc(b.label||"(無題)")}${end}${tag}</span></div></div>`;
        });
        html += `</div>`;
      }
      html += `<p class="set-block" style="border:none;box-shadow:none;padding:0;margin:10px 0 0;font-size:11.5px;color:var(--muted)">「予定」はチェックなしの表示だけ。「タスク」は適用時に完了操作の対象として置かれます。</p>`;
    } else {
    html += `<div id="tplForm"><label class="fld"><span>タイトル</span><input type="text" id="tplName" value="${esc(draft.name)}"></label>
    <div class="sec-title sec-title-add" style="margin:14px 2px 4px">
      <span>予定</span><button class="btn tiny" data-act="tpl-add-row">＋ 追加</button>
    </div>
    <div class="tpl-editor" id="tplEditor">`;
    (draft.plans||[]).forEach((b,i)=>{
      const endV = b.mins ? endFromDur(b.time, b.mins) : "";
      html += `<div class="tpl-line" data-i="${i}">
        <input type="text" value="${esc(b.label)}" data-f="label" placeholder="例: 仕事 / 睡眠" class="tpl-name">

        </div>

    html += `</div>

      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn primary" data-act="tpl-save" style="margin-left:auto">保存</button>
      </div>
      ${db.templates.length>1 ? `<button class="btn" style="margin-top:8px;color:var(--over);border-color:var(--over)" data-act="tpl-del">このテンプレートを削除</button>` : ""}
    </div>`;
    }
  }
  M.innerHTML = html;
}

     <p class="sheet-sub"><strong>マージ</strong>: この端末とテキスト側、それぞれにしかない項目はどちらも残ります。同じ項目を両方で編集していた場合だけテキスト側が優先されます——他の端末で編集した内容をこの端末にも反映したいとき（v3.107〜）。<br>
     <strong>完全に置き換え</strong>: この端末の内容をすべて消し、テキストの内容だけにします——壊れた・おかしいデータをまっさらに戻したいとき。</p>
     <div style="margin-bottom:8px">
       <label class="btn ghost" style="display:inline-flex;cursor:pointer">
         ファイルを選択<input type="file" id="importFile" accept="application/json,.json" style="display:none">
       </label>
     </div>

     <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn primary" data-act="do-import-merge">マージして読み込む</button>
       <button class="btn ghost" data-act="do-import-replace">完全に置き換える</button>
     </div>`);

  html += setCard("debug", "デバッグログ", ()=>

     <pre class="io" style="white-space:pre-wrap;min-height:80px">${esc(debugLog.slice(-24).join("\n") || "(なし)")}</pre>
     <div style="margin-top:8px"><button class="btn" data-act="copy-debug">コピー</button></div>`);

  html += setCard("reset", "リセット", ()=>
    `<p>「記録をリセット」はタスク・実施・履歴だけを消し、<strong>テンプレートと設定は残します</strong>。「すべて初期化」はテンプレートも含めて出荷状態に戻します。</p>
     <button class="btn" style="color:var(--over);border-color:var(--over)" data-act="reset-records">記録をリセット</button>
     <button class="btn" style="margin-top:8px;color:var(--over);border-color:var(--over)" data-act="reset-all">すべて初期化（テンプレートも）</button>`);

  const saved = db.meta && db.meta.savedAt ? new Date(db.meta.savedAt).toLocaleString() : "—";
  html += `<p class="summary" style="margin:18px 2px 0">LifeCore v${esc(APP_VERSION)} ・ この端末の最終保存: ${esc(saved)}</p>`;

/* -- pick a registered task to place into the template being edited -- */
function sheetTplTaskPick(){
  // 同じタスクを時間を変えて何度でも配置できる（v3.20）ので、既に配置ずみの
  // タスクも一覧から外さない。ここでは "現在編集中の下書き" を見る — 保存ずみの
  // tpl.tasks を見ると、直前に足したばかりの行がまだ反映されていない。
  const draft = state._tplDraft;
  const placedCount = {};
  (draft?.tasks || []).forEach(r=>{ placedCount[r.taskId] = (placedCount[r.taskId] || 0) + 1; });
  const cands = db.tasks.filter(t=>!(t.kind==="single" && t.done));
  const body = cands.length ? cands.map(t=>{
    const info = t.kind==="repeat"
      ? (t.freq?.type==="daily" ? "継続 ・ 毎日" : `継続 ・ 週${t.freq.n}回`)
      : "完了型";
    const n = placedCount[t.id] || 0;
    return `<button class="cand" data-act="tpl-task-pick" data-id="${t.id}">
      <div style="flex:1;min-width:0"><div class="cd-name">${esc(t.name)}</div>
      <div class="cd-meta"><span>${esc(t.category||"—")}</span>${t.estMin?`<span>${t.estMin}分</span>`:""}<span>${info}</span>${n?`<span>配置ずみ ×${n}</span>`:""}</div></div>
      <span class="btn tiny primary">置く</span>
    </button>`;
  }).join("") : `<div class="empty" style="border:none">置けるタスクがありません。<br>「タスク」タブで登録してください。</div>`;
  openSheet(`<h2>タスクを配置</h2>
    <p class="sheet-sub">登録ずみのタスクから選びます。次の画面で開始時刻を指定してから配置されます。同じタスクを時間を変えて複数回配置することもできます。</p><div>${body}</div>`);
}

/* -- add "today" task from candidates --
   ここは「ストックされているタスク一覧」から ToDoリストに追加するタスクを選ぶ画面
   であって、ToDoリストそのものではない（見出しを分けている理由）。
   完了型／継続型が混ざると探しにくいので、タスクタブと同じ切替タブで絞り込む。 */
function sheetTodayPick(){
  const d = state.date;
  const view = state.pickView === "repeat" ? "repeat" : "single";
  const cands = db.tasks.filter(t=>{
    if(t.kind !== view) return false;
    // 完了型は、今日すでに置いたものは候補から外す（1日1回やる想定）。
    // 継続型は、時間を変えて同じタスクを1日に何度でも置ける想定なので、
    // 今日すでに置いてあるかどうかでは候補から外さない（v3.64）。
    if(t.kind==="single") return !t.done && !hasOccToday(t.id,d);
    return true;
  });
  // タイトル以外の情報は、タスクタブでの表示（完了型＝重要度→開始→期限→カテゴリ、
  // 継続型＝種類→頻度→カテゴリ）と同じものを同じ順で出す
  const candRow = t => {
    const metaChips = t.kind==="single"
      ? `${prioChip(t)}${fieldChip("開始", mdShort(t.startDate, t.startPrec))}${fieldChip("期限", mdShort(t.due, t.duePrec), dueClass(t.due))}<span class="ti-cat">${esc(t.category||"—")}</span>`
      : `${rtypeChip(t)}${t.freq?.type==="perWeek"
          ? `<span class="ti-freq ${weekCount(t.id,d)>=t.freq.n?"met":""}">今週 ${weekCount(t.id,d)}/${t.freq.n}</span>`
          : `<span class="ti-freq">毎日</span>`}<span class="ti-cat">${esc(t.category||"—")}</span>`;
    return `<button class="cand" data-act="pick-add" data-id="${t.id}">
      <div style="flex:1;min-width:0"><div class="cd-name">${esc(t.name)}</div>
      <div class="cd-meta">${metaChips}</div>
      ${t.note?`<div class="cd-note">${esc(t.note)}</div>`:""}</div>
      <span class="btn tiny primary">選択</span>
    </button>`;
  };

  let sortUI = "", body;
  if(!cands.length){
    body = `<div class="empty" style="border:none">追加できる${view==="single"?"完了型":"継続型"}タスクがありません。<br>「タスク」タブで登録してください。</div>`;
  } else if(view === "single"){
    // タスクタブと同じ並び順（デフォルト／重要度順／期限順）をここにも用意する
    const sort = ["default","prio","due"].includes(state.pickSort) ? state.pickSort : "default";
    sortUI = `<div style="display:flex;align-items:center;gap:8px;margin:2px 0 8px">
      <span style="font-size:12px;color:var(--muted)">並び順</span>
      <div class="seg" style="margin:0">
        <button class="${sort==="default"?"on":""}" data-act="pick-sort" data-v="default">デフォルト</button>
        <button class="${sort==="prio"?"on":""}" data-act="pick-sort" data-v="prio">重要度順</button>
        <button class="${sort==="due"?"on":""}" data-act="pick-sort" data-v="due">期限順</button>
      </div>
    </div>`;
    if(sort !== "default"){
      body = [...cands].sort(sort==="prio" ? byPrioFlat : byDueFlat).map(candRow).join("");
    } else {
      // デフォルト: タスクタブと同じ4象限（アイゼンハワー・マトリクス）グループ分け
      const present = QUADRANTS.filter(([q]) => cands.some(t=>quadrant(t)===q));
      body = present.map(([q,lab])=>{
        const items = cands.filter(t=>quadrant(t)===q).sort(byQuadrant);
        return `<div class="due-head">${lab}<span>${items.length}</span></div><div>${items.map(candRow).join("")}</div>`;
      }).join("");
    }
  } else {
    // v3.93: タスクタブと同様、種類のグループ順は「ルーティン→スキル」、
    // 各グループ内は登録が古い順
    const rtypeGroups = [["routine","ルーティン"],["skill","スキル"]];
    const present = rtypeGroups.filter(([key])=>cands.some(t=>(t.rtype||"routine")===key));
    body = present.map(([key,label])=>{
      const items = cands.filter(t=>(t.rtype||"routine")===key).sort(byCreated);
      return `<div class="due-head">${label}<span>${items.length}</span></div><div>${items.map(candRow).join("")}</div>`;
    }).join("");
  }

  openSheet(`<div class="sheet-sticky-block">
      <div class="sheet-sticky-head">
        <h2>ToDoリストに追加</h2>
        <div class="sheet-sticky-actions">
          <button class="btn tiny ghost" data-act="close-sheet">キャンセル</button>
        </div>
      </div>
      <p class="sheet-sub">選ぶと、開始時刻を決めるか、時間未定のまま追加するか選べます。</p>
      <div class="seg" style="margin:0 0 6px">
        <button class="${view==="single"?"on":""}" data-act="pick-view" data-v="single">完了型</button>
        <button class="${view==="repeat"?"on":""}" data-act="pick-view" data-v="repeat">継続型</button>
      </div>
      ${sortUI}
    </div>
    <div>${body}</div>`);
}

/* v3.122: 「ひと段落」機能。fromKey（数値の分キー、timeKey()と同じ表記）〜
   就寝(HD_BEDTIME_KEY)までの空き時間に、後回し度が高いスキル系継続型
   タスクから順に、目安時間（estMin、無ければHD_DEFAULT_MIN）ぶんだけ
   時系列で最初に入る空きギャップへ貪欲に詰める。入らない候補はスキップ
   する（提案しないだけで、削除や先送り扱いにはしない）。
   v2拡張ポイント: 余裕時間の傾斜配分やタスクごとの上限時間を足すなら、
   下の `const min = ...` の行と、割り当て後の余り処理をここに追加する。
   純粋関数（db.tasks/db.occurrencesを読むだけで書き込まない）。 */
function planHitodanraku(date, fromKey){
  if(fromKey >= HD_BEDTIME_KEY) return { gaps: [], plan: [] };
  const gaps = freeGapsFrom(date, fromKey, HD_BEDTIME_KEY).map(g => ({...g}));

  // 今日すでに未完了(planned)の実施が残っているタスクだけ除外する——
  // 今日done済みでも、継続型タスクは1日に複数回置ける既存の設計思想
  // （sheetTodayPick()と同じ考え方）に合わせ、再提案の対象にする。
  const pendingToday = t => db.occurrences.some(o => o.taskId===t.id && o.date===date && o.status==="planned");
  const candidates = db.tasks
    .filter(t => t.kind==="repeat" && (t.rtype||"routine")==="skill" && !pendingToday(t))
    .map(t => ({ task:t, backlog: skillBacklog(t, date) }))
    .sort((a,b) => b.backlog - a.backlog || (a.task.createdAt||"").localeCompare(b.task.createdAt||""));

  const plan = [];
  candidates.forEach(({task}) => {
    const min = task.estMin || HD_DEFAULT_MIN;
    const gap = gaps.find(g => (g.end - g.start) >= min);
    if(!gap) return;
    plan.push({ task, start: keyToTime(gap.start), min });
    gap.start += min;
  });
  return { gaps, plan };
}

function sheetHitodanrakuPreview(fromTime){
  const { gaps, plan } = planHitodanraku(state.date, timeKey(fromTime));
  if(!gaps.length || !gaps.some(g=>g.end>g.start)){
    openSheet(`<h2>ひと段落</h2>
      <p class="sheet-sub">${esc(fromTime)}〜25:00の間に空き時間がありませんでした。</p>
      <div class="sheet-actions"><button class="btn primary" data-act="close-sheet">閉じる</button></div>`);

  if(!plan.length){
    openSheet(`<h2>ひと段落</h2>
