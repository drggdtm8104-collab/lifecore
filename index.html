// v3.125: sheetTaskのフォーム読み取り・保存を共通化（「保存」「保存して追加」の
// 両方から使う）。バリデーション失敗時はnullを返す（フォーカス移動のみ行い、
// 呼び出し側はbreakする）。
function saveTaskFromForm(id){
  const name = document.getElementById("tkName").value.trim();
  if(!name){ document.getElementById("tkName").focus(); return null; }
  const kind = document.querySelector("#tkKind button.on")?.dataset.v || "single";
  const rawMin = document.getElementById("tkMin").value.trim();
  const estMin = rawMin === "" ? null : (parseInt(rawMin,10) || null);   // blank = no duration
  const cat = document.querySelector("#tkCat button.on")?.dataset.v || "その他";
  const note = (document.getElementById("tkNote").value || "").trim();
  const prio = kind==="single" ? (document.querySelector("#tkPrio button.on")?.dataset.v || "low") : "low";
  // 期限・開始時期: 粒度が「日付」なら type=date の値をそのまま、それ以外は
  // 「YYYY-MM」＋粒度から実効日（月末寄り=期限／月初寄り=開始）を計算する
  const duePrec = kind==="single" ? (document.querySelector("#tkDuePrec button.on")?.dataset.v || "day") : "day";
  let due = null;
  if(kind==="single"){
    if(duePrec==="day") due = document.getElementById("tkDue")?.value || null;
    else { const mv = document.getElementById("tkDueMonth")?.value; due = mv ? effDateFromMonth(mv, duePrec, true) : null; }
  }
  const startPrec = kind==="single" ? (document.querySelector("#tkStartPrec button.on")?.dataset.v || "day") : "day";
  let startDate = null;
  if(kind==="single"){
    if(startPrec==="day") startDate = document.getElementById("tkStart")?.value || null;
    else { const mv = document.getElementById("tkStartMonth")?.value; startDate = mv ? effDateFromMonth(mv, startPrec, false) : null; }
  }
  let freq = null;
  const rtype = kind==="repeat" ? (document.querySelector("#tkRtype button.on")?.dataset.v || "routine") : null;
  if(kind==="repeat"){
    const ft = document.querySelector("#tkFreq button.on")?.dataset.v || "daily";
    freq = ft==="perWeek" ? { type:"perWeek", n: parseInt(document.getElementById("tkNv").textContent,10)||3 } : { type:"daily" };
  }
  let t;
  if(id){
    t = db.tasks.find(x=>x.id===id);
    Object.assign(t, { name, kind, estMin, category:cat, freq, note, due, duePrec, prio, startDate, startPrec, rtype });
  } else {
    t = { id:uid(), name, kind, freq, estMin, category:cat, note, due, duePrec, prio, startDate, startPrec, rtype, done:false, createdAt:todayStr() };
    db.tasks.push(t);
  }
  // v3.66: 今日の実施の進捗メモ（あれば）も一緒に保存 — ToDoリストのカードの
  // 編集画面と同じ occurrence.note を書き換える（連動）
  const progressEl = document.getElementById("tkProgress");
  if(progressEl){
    const occ = db.occurrences.find(o=>o.id===progressEl.dataset.occid);
    if(occ) occ.note = progressEl.value.trim();
  }
  return t;
}

/* ============================================================
   ACTIONS
   ============================================================ */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const v = el.dataset.v;
  // ジャンプ先カードの光る目印は、次に何か操作したら消す（ジャンプそのものは除く）
  if(act !== "goto-task-in-list" && state._highlightOccId) state._highlightOccId = null;
 try{
  switch(act){
    case "tab": {
      flushNoteSave();
      state.tab = v;
      if(v==="today") state.date = todayStr();
      if(v==="notes") state.noteId = null;   // メモタブは常に一覧から
      closeFab(); render();
      if(state.tab==="today" && state.date===todayStr()) scrollToNow(); else M.scrollTop = 0;
      break;
    }
    case "open-note": { flushNoteSave(); state.noteId = id; render(); M.scrollTop = 0; break; }
    case "notes-back": { flushNoteSave(); state.noteId = null; render(); M.scrollTop = 0; break; }
    case "del-note": {
      askConfirm("このメモを削除しますか？\n元に戻せません。", ()=>{
        clearTimeout(noteTimer); noteTimer = null;
        db.notes = db.notes.filter(x=>x.id!==id);
        state.noteId = null;
        save(); render(); toast("削除しました");
      });
      break;
    }
    case "day-step": {
      const nx = addDays(state.date, +v);
      if(+v > 0 && nx > addDays(todayStr(), MAX_AHEAD)) break;   // cap how far ahead
      state.date = nx; closeFab(); render();
      if(state.date===todayStr()) scrollToNow(); else M.scrollTop = 0;
      break;
    }
    case "today-view": {
      state.todayView = v; render();
      if(v==="timeline" && state.date===todayStr()) scrollToNow(); else M.scrollTop = 0;
      break;
    }
    case "goto-task-in-list": {
      // タイムテーブルの状態表示から「ToDoリスト」一覧の該当カードへ飛ぶ。
      // 目印として光らせ、次に何か操作するまで消さない。
      state.todayView = "list"; state._highlightOccId = id; render();
      scrollToOcc(id);
      break;
    }
    case "tasks-view": { state.tasksView = v; render(); M.scrollTop = 0; break; }
    case "task-sort": { state.taskSort = v; render(); break; }
    case "edit-day": state.tab = "today"; state.date = v; render(); M.scrollTop = 0; break;
    case "go-settings": state.tab="settings"; render(); M.scrollTop=0; break;
    case "scroll-top": M.scrollTop = 0; break;
    case "go-tpl-edit": {
      const m = db.dayMeta[state.date];
      state.tab = "templates";
      if(m && m.templateId) state.settingsTplId = m.templateId;
      state.tplView = "edit";
      render(); M.scrollTop = 0; break;
    }
    case "go-today": state.tab="today"; render(); M.scrollTop=0; break;
    case "close-sheet": closeSheet(); break;
    case "confirm-no": _confirmCb = null; closeSheet(); break;
    case "confirm-yes": { const cb = _confirmCb; _confirmCb = null; closeSheet(); if(cb) cb(); break; }

    case "pick-template": sheetPickTemplate(); break;
    case "apply-tpl": applyTemplate(state.date, id); closeSheet(); render(); break;
    case "clear-tpl": {
      const d = state.date;
      askConfirm("テンプレートを外しますか？\nテンプレの予定と、まだ手をつけていない配置タスクが消えます。\n個別に追加したタスクや、すでに完了・一部実施したものは残ります。", ()=>{
        clearTemplateForDay(d);
        render(); toast("テンプレートをクリアしました");
      });
      break;
    }

    case "fab-toggle": FABM.hidden ? openFab() : closeFab(); break;
    case "open-today-pick": closeFab(); sheetTodayPick(); break;
    case "open-marker": closeFab(); sheetMarker(null); break;
    case "open-hitodanraku": closeFab(); sheetHitodanraku(); break;
    case "hd-generate": {
      const time = document.getElementById("hdTime")?.value || fmtNowTime();
      db.dayMeta[state.date] = Object.assign({}, db.dayMeta[state.date], { hitodanrakuAt: time });
      save();
      sheetHitodanrakuPreview(time);

            if(sub){
              try{
                const res = await fetch(PUSH_SERVER + "/unsubscribe", {
                  method:"POST", headers:{ "Content-Type":"application/json", "X-LifeCore-Token": PUSH_SHARED_TOKEN },
                  body: JSON.stringify({ endpoint: sub.endpoint }),

                dbg("[push] unsubscribe response:", res.status);

            }

            return;
          }
          const perm = await Notification.requestPermission();
          if(perm !== "granted"){ toast("通知が許可されませんでした"); dbg("[push] permission:", perm); return; }
          const reg = await navigator.serviceWorker.ready;
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(PUSH_VAPID_PUBLIC_KEY),
          });
          // v3.116: fetch()はHTTPエラー応答（401など）では例外を投げないため、
          // response.okを見ずに「通知をオンにしました」と出していた——サーバー側
          // への保存が実際には失敗していても成功したように見えてしまうバグ
          // だった。ステータスを確認し、失敗ならエラーとして扱う。
          const res = await fetch(PUSH_SERVER + "/subscribe", {
            method:"POST", headers:{ "Content-Type":"application/json", "X-LifeCore-Token": PUSH_SHARED_TOKEN },
            body: JSON.stringify(sub.toJSON()),
          });
          dbg("[push] subscribe response:", res.status);
          if(!res.ok){
            const text = await res.text().catch(()=> "");
            throw new Error(`サーバーへの登録に失敗しました（${res.status}）${text}`);
          }
          pushSubState = "on"; render(); toast("通知をオンにしました");
          schedulePushTasksSync();   // 初回は次のsave()を待たず、すぐ時間指定タスクを同期する
        }catch(e){
          toast("通知の設定でエラーが発生しました: " + e.message);
          dbg("[push] toggle failed:", e.message);
        }
      })();
      break;

          ()=>toast("この画面ではファイル保存できません。手動で選択してコピーしてください"));
        break;
      }
      try{
        const blob = new Blob([JSON.stringify(db)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        // v3.114: 日付だけだと同じ日に複数回保存したときにファイル名が
        // 衝突する（上書きされる／末尾に(1)などが付いて分かりにくくなる）
        // ため、分単位の時刻まで含める。スケジュール上の「4時で日付が
        // 切り替わる」概念（todayStr()）ではなく、実際の今の時刻を使う。
        const now = new Date();
        const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
        const a = document.createElement("a");
        a.href = url; a.download = `lifecore-backup-${stamp}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
        toast("ダウンロードしました");
      }catch(e){ toast("ダウンロードできません: " + e.message); }
      break;
    }
    case "copy-tasks-text": {
      const box = document.getElementById("tasksTextBox");
      box.focus(); box.select();
      navigator.clipboard?.writeText(box.value).then(()=>toast("コピーしました"),()=>toast("手動で選択してコピーしてください"));
      break;
    }
    case "copy-debug": {
      const txt = debugLog.join("\n");
      navigator.clipboard?.writeText(txt).then(()=>toast("コピーしました"),()=>toast("手動で選択してコピーしてください"));
      break;
    }
    // v3.107: 同期を前提にせず「必要なときに手動でPC⇔スマホの内容を
    // 反映する」運用にするため、読み込みを「マージ」と「完全に置き換え」の
    // 2択にした。以前は常にまるごと置き換えで、両端末で編集してから
    // 読み込むと片方の変更がそのまま消える危険があった——マージはクラウド
    // 同期で使っているmergeDb()（id単位、同じ項目は貼り付けた側を優先し、
    // それぞれにしかない項目はどちらも残す）をそのまま流用する。
    case "do-import-merge": case "do-import-replace": {
      const raw = document.getElementById("importBox").value.trim();
      if(!raw) break;
      let next;
      try{
        next = JSON.parse(raw);
        if(!next || !Array.isArray(next.tasks)) throw new Error("形式が違います");
      }catch(err){ toast("読み込めません: " + err.message); break; }
      const doMerge = act === "do-import-merge";
      const msg = doMerge
        ? "この端末のデータと、貼り付けた内容をマージします。それぞれにしかない項目はどちらも残りますが、同じ項目を両方で編集していた場合は貼り付けた側の内容が優先されます。元に戻せません。"
        : "現在のデータをこの内容で完全に置き換えます。元に戻せません。";
      askConfirm(msg, ()=>{
        const incoming = migrate(next);
        if(!incoming.settings) incoming.settings = {showOutlook:true};
        db = doMerge ? mergeDb(db, incoming) : incoming;
        saveLocal(); resyncFull(); state.tab="today"; render(); toast(doMerge?"マージしました":"読み込みました");
      });
      break;
    }
    case "restore-premerge": {
      const raw = localStorage.getItem(KEY + ".premerge");
      if(!raw){ toast("退避データがありません"); break; }
      askConfirm("この端末の旧データで現在のデータを置き換えます。元に戻せません。", ()=>{
        try{
          db = migrate(JSON.parse(raw)); if(!db.settings) db.settings = {showOutlook:true};
          localStorage.removeItem(KEY + ".premerge");
          saveLocal(); resyncFull(); state.tab="today"; render(); toast("旧データを復元しました");
        }catch(e){ toast("復元できません: " + e.message); }
      });
      break;
    }
    // v3.92: この端末側に古い/汚染されたデータが残っていると、クラウド側を
    // 直接きれいにしても、次にこの端末が同期したときに古い内容をそのまま
    // クラウドへ書き戻してしまい、元に戻ってしまう（実際に発生した）。
    // この端末の保存内容を丸ごと消してから読み込み直すと、loadLocal() が
    // サンプル状態にフォールバックし（meta.sample=true）、起動時同期で
    // マージではなく「クラウドの内容にまるごと置き換え」が働く
    // （adoptFromDB() の localIsSample 分岐、v3.87〜）ので、クラウド側の
    // 内容だけがそのまま反映される。クラウド側は一切変更しない。
    case "reload-from-cloud": {
      askConfirm("この端末に保存されている内容を消して、クラウドの内容を読み込み直します。この端末だけの変更（まだクラウドに届いていないもの）があれば失われます。元に戻せません。", ()=>{
        try{
          localStorage.removeItem(KEY);
          localStorage.removeItem(KEY + ".premerge");
          localStorage.removeItem(KEY + ".corrupt");
        }catch(e){}
        location.reload();
      });
      break;
    }
    case "reset-records": {
      askConfirm("タスク・実施・履歴をすべて削除します。\n（テンプレートと設定は残ります）\n元に戻せません。", ()=>{
        db.tasks = []; db.occurrences = []; db.dayMeta = {};
        db.meta = db.meta || {}; db.meta.sample = false;
        saveLocal(); resyncFull(); state.tab="today"; state.date=todayStr(); render(); toast("記録をリセットしました");
      });
      break;
    }
    case "reset-all": {
      askConfirm("テンプレートを含め、すべてを初期状態（サンプルデータ）に戻します。\n元に戻せません。", ()=>{
        localStorage.removeItem(KEY); db = migrate(seed()); db.meta.sample=false;
        saveLocal(); resyncFull();
        state.tab="today"; state.date=todayStr(); state.settingsTplId=null; render(); toast("初期状態に戻しました");
      });
      break;
    }
    case "clear-sample": {
      db.tasks = []; db.occurrences = []; db.dayMeta = {}; db.notes = []; db.remarks = []; db.meta.sample = false;
      saveLocal(); resyncFull(); render(); break;
    }
  }
 }catch(err){ dbg("[click] '" + act + "' THREW:", err && err.message); try{ toast("エラー: " + (err && err.message)); }catch(e){} }

/* read the template editor DOM back into the in-progress draft (state._tplDraft) —
   so in-progress edits survive add-row / delete-row, not just Save. Never touches
   db.templates directly; that only happens when "保存" is pressed. */
function readTplEditor(){
  const draft = state._tplDraft;
  if(!draft) return;
  if(!document.getElementById("tplForm")) return;   // not in the edit view
  const nameEl = document.getElementById("tplName");
  if(nameEl) draft.name = nameEl.value.trim() || draft.name;
  // 予定 rows
  const planLines = [...document.querySelectorAll("#tplEditor .tpl-line")];
  draft.plans = planLines.map(line=>{
    const time    = line.querySelector('[data-f="time"]').value || "00:00";
    const end     = (line.querySelector('[data-f="end"]').value || "").trim();
    const rawMins = (line.querySelector('[data-f="mins"]').value || "").trim();
    let mins = end ? durFromEnd(time, end) : (rawMins === "" ? null : (parseInt(rawMins,10) || null));
    if(mins === 0) mins = null;
    const free = !!line.querySelector('[data-f="free"]')?.checked;
    return { time, label: line.querySelector('[data-f="label"]').value.trim(), mins, category:"", freeBlock: free };
  });
  // task placements
  const taskLines = [...document.querySelectorAll("#tplTasks .tpl-task-line")];
  draft.tasks = taskLines.map(line=>{
    const time    = line.querySelector('[data-f="time"]').value || "00:00";
    const rawMins = (line.querySelector('[data-f="mins"]').value || "").trim();
    let mins = rawMins === "" ? null : (parseInt(rawMins,10) || null);
    if(mins === 0) mins = null;
    return { taskId: line.dataset.taskid, time, mins };
  });
}

/* Keep template-editor edits in the draft (state._tplDraft) as each field loses
   focus — but DON'T save to db.templates or re-render while interacting (that
   used to tear the time picker out from under the user mid-scroll, and leaked
   unsaved edits into other screens). Persisting only happens on "保存".
   Rows are re-sorted into time order only on an explicit action: "＋ 行を追加"
   or "保存". */
document.addEventListener("focusout", e=>{
  const el = e.target;
  if(el && (el.id === "noteBody" || el.id === "noteTitle")){ flushNoteSave(); return; }
  if(!el || !el.closest || !el.closest('#tplForm')) return;
  readTplEditor();
});

/* メモ: 打つたびに in-memory を更新し、少し待ってから保存（再描画はしない） */
document.addEventListener("input", e=>{
  const el = e.target;
  if(!el || (el.id !== "noteBody" && el.id !== "noteTitle")) return;
  const n = db.notes.find(x=>x.id===state.noteId);
  if(!n) return;
  if(el.id === "noteBody") n.body = el.value; else n.title = el.value;
  n.updatedAt = new Date().toISOString();
  scheduleNoteSave();
});

// start sync AFTER the UI is interactive, and never let it be fatal.
// 2026-09-15: this used to wait a full 1000ms before even starting the sync
// check, purely to "let the UI settle" — but that 1000ms is pure dead time
// during which a stale/old localStorage snapshot (e.g. from days ago, or from
// before the last successful cross-device sync) sits on screen looking like
// today's real data, which reads as "a wrong table flashed" to the user.
// render() above is synchronous and already finishes (and the browser already
// gets to paint) before any timer callback can run, so a much shorter delay
// still achieves "don't compete with the first paint" without needlessly
// prolonging how long stale local data stays on screen before the real sync
// check swaps it out.
setTimeout(()=>{ initDB().catch(e=>console.error("[sync] initDB rejected", e)); }, 50);

let pushSubState = "checking";   // "checking" | "unsupported" | "off" | "on"

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function refreshPushState(){
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window)){ pushSubState = "unsupported"; return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    pushSubState = sub ? "on" : "off";
  }catch(e){ pushSubState = "off"; }
  if(state.tab==="settings") safeRender();
  if(pushSubState==="on") schedulePushTasksSync();
}

// v3.118: 今日のまだ終わっていない・時間が決まっている実施（タスク・

// 無い（＝まだ時間未定の）ものは対象外——「時間が決まっているタスクに
// 関して」というユーザーの指示どおり。
function todaysTimedTasks(){
  const t = todayStr();
  return db.occurrences
    .filter(o => o.date===t && !o.plan && o.status!=="done" && o.plannedStart)
    .map(o => ({ id:o.id, name:occName(o), time:o.plannedStart }))
    .filter(x => x.name);
}

let pushDigestTimer = null;
function schedulePushTasksSync(){
  if(pushSubState !== "on") return;
  clearTimeout(pushDigestTimer);
  pushDigestTimer = setTimeout(()=>{
    const tasks = todaysTimedTasks();
    fetch(PUSH_SERVER + "/today-digest", {
      method:"POST", headers:{ "Content-Type":"application/json", "X-LifeCore-Token": PUSH_SHARED_TOKEN },
      body: JSON.stringify({ date: todayStr(), tasks }),
    }).then(res=>dbg("[push] tasks sync:", res.status)).catch(e=>dbg("[push] tasks sync failed:", e.message));
  }, 3000);
}
