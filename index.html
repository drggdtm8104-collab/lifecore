<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- v3.108: 自前ホスト（GitHub Pagesなど、Artifactの外）でも正しく表示・
     PWA化できるように、doctype/html/head/bodyや以下のPWA関連タグを追加した。
     Artifact上で開いたときはArtifact側が周りを包んでくれていたため、これらが
     無くても表示できていた。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeCore</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2F6F5E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ============================================================
     LifeCore v1  —  tokens
     ============================================================ */
  :root{
    --ground:#F7F8F6;
    --surface:#FFFFFF;
    --surface-2:#F1F3EF;
    --ink:#1E2529;
    --muted:#5F6866;
    --faint:#98A19D;
    --hairline:#E4E4DD;
    --primary:#2F6F5E;
    --primary-ink:#22574A;
    --on-primary:#FFFFFF;
    --done:#2F6F5E;
    --partial:#A9791C;
    --defer:#868C97;
    --over:#B4482E;
    --wash:#E9F1EE;
    --shadow:0 1px 2px rgba(22,32,29,.05), 0 3px 12px rgba(22,32,29,.06);
    --radius:13px;
    --font-display:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
    --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  :root[data-theme="light"]{ color-scheme:light; }

  /* explicit dark choices. GREEN = the original green-tinted dark. DARK = neutral black. */
  :root[data-theme="green"]{
    color-scheme:dark;
    --ground:#121614;
    --surface:#1A201E;
    --surface-2:#232A27;
    --ink:#E7EAE4;
    --muted:#9AA39E;
    --faint:#6C766F;
    --hairline:#2B332F;
    --primary:#5FB79E;
    --primary-ink:#8CD0BC;
    --on-primary:#0E1513;
    --done:#5FB79E;
    --partial:#D8A54A;
    --defer:#818A94;
    --over:#DB7D63;
    --wash:#1E2E29;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 3px 14px rgba(0,0,0,.34);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#0C0C0C;
    --surface:#181818;
    --surface-2:#222222;
    --ink:#EAEAEA;
    --muted:#9C9C9C;
    --faint:#6A6A6A;
    --hairline:#2C2C2C;
    --primary:#5FB79E;
    --primary-ink:#8CD0BC;
    --on-primary:#0E1513;
    --done:#5FB79E;
    --partial:#D8A54A;
    --defer:#868C97;
    --over:#DB7D63;
    --wash:#182420;
    --shadow:0 1px 2px rgba(0,0,0,.40), 0 3px 14px rgba(0,0,0,.46);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:13px;
    line-height:1.5;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font:inherit;color:var(--ink)}
  /* clearly-faded placeholders so they don't read as entered text */
  ::placeholder{color:color-mix(in srgb,var(--faint) 65%,transparent);opacity:1}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}

  /* ---------- shell (fixed app frame, only <main> scrolls) ---------- */
  /* v3.91: v3.90のJS（visualViewportの高さをCSS変数に反映）は、下部の
     タブバーが画面外に切れる問題を直せず、さらに「画面全体が下にずれ、
     上に空白ができる」という新しい不具合まで生んでしまった。
     height:100vh/100dvh のような「高さを計算する」方式そのものが、
     iOS Safariのツールバー表示状態の変化に弱い（計算のもとになる
     ビューポートの基準がずれることがある）。position:fixed; inset:0
     （画面の四辺にそのまま貼り付ける指定）に切り替える——これは「高さを
     計算」するのではなく「実際に見えている範囲の外周に直接固定する」
     指定なので、ツールバーの表示状態が変わっても外周からずれることが
     なく、より安定する。あわせて、うまくいかなかったJS（visualViewport
     を使った再計算）は撤去した。 */
  .app{
    position:fixed;
    inset:0;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:var(--ground);
    border-inline:1px solid var(--hairline);
    overflow:hidden;
  }
  @media (max-width:481px){ .app{border-inline:none} }

  .header{
    flex:none;z-index:2;
    background:var(--ground);
    border-bottom:1px solid var(--hairline);
    padding:11px 15px 9px;
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .h-date{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    letter-spacing:.01em;
    line-height:1.2;
    text-wrap:balance;
  }
  .h-view{font-family:var(--font-display);font-weight:600;font-size:18px;display:inline-flex;align-items:center;gap:7px}
  .h-view svg{width:19px;height:19px;flex:none;color:var(--primary)}
  /* どの画面にいても今の日付を意識できるように、ヘッダーのボタン列に常設する
     日付表示（枠つきで少し強調。ジャンプボタン・設定ボタンと同じ高さに揃える）。
     v3.71: 色は緑（アプリのメインカラー、v3.70）以外を試す。既存の意味付き
     カラー（--over=期限切れ等、--partial=期限間近、--defer=延期）と被らない
     ニュートラルな青系を --h-nowdate-accent として1箇所にまとめた
     ——ここの値だけ変えれば色を差し替えられる。文字色は元の --ink に戻した。
     v3.72: 背景をもっとはっきり青みがかるよう混合比を上げ、逆に枠線は
     周りのアイコンボタンとなじむよう --hairline に戻した（強調は背景の
     色だけで出す）。
     v3.73: 枠線だけでは平面的なので、影（v3.69で一度試したもの）を
     この枠線と組み合わせて、周りのボタン列より一段浮いているように
     見せる（枠線の色自体は据え置き、奥行きだけ足す）。
     v3.74: 青の次に紫系を試す。既存の意味付きカラーとは被らない。
     --h-nowdate-accent の値だけ差し替え、他は変更なし。
     v3.75: 独自の色を試すのをやめ、テンプレート選択チップ（`.chip.solid`。
     「平日在宅」等のボタン）と同じ配色に揃えた——background: var(--wash)、
     border-color: transparent、color: var(--primary-ink)。アプリの
     他の場所と同じ「選択されている・強調されている」印象の色を流用する
     形にし、新しい色を持ち込まないようにした。影（v3.73）はそのまま残す。
     v3.76: 「文字と枠線は最初に戻してみて」——背景（--wash）と影は
     v3.75のまま残し、文字色と枠線だけ最初（v3.68以前）の
     border:1px solid var(--hairline) / color:var(--ink) に戻した。
     v3.77: 「背景の色を追加ボタンと同じ明るい緑にしてみて」——薄い
     --wash から、.btn.primary（「＋ 追加」等）と同じ塗りつぶしの
     var(--primary) に変更。文字色・枠線はv3.76のまま変更していない。
     v3.78: 「一番最初の状態から枠線だけ緑の発光色になるようにして」——
     背景・文字色は最初期（v3.68以前: background:var(--surface)、
     color:var(--ink)）に戻し、影は中立な --shadow をやめて、枠線を
     緑にした上でその周りにぼかした緑を滲ませる「発光」表現にした
     （border:1px solid var(--primary) ＋ box-shadow に緑のぼかしを追加）。
     v3.79: 「発光感を少し抑えられる？」——ぼかし半径6px→4px、
     広がり1px→0、濃さ65%→40%に落として控えめにした。 */
  .h-nowdate{
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;
    border-radius:9px;border:1px solid var(--primary);
    box-shadow:0 0 4px 0 color-mix(in srgb, var(--primary) 40%, transparent);
    background:var(--surface);
    font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink);
    flex:none;white-space:nowrap;
  }
  .h-nowdate .h-nowtime{font-variant-numeric:tabular-nums}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;color:var(--muted);
    border:1px solid var(--hairline);background:var(--surface);
    flex:none;
  }
  .icon-btn:active{background:var(--surface-2)}
  .icon-btn svg{width:18px;height:18px}
  .hbtn{
    flex:none;min-height:32px;padding:6px 12px;border-radius:9px;
    font-size:12px;font-weight:600;color:var(--primary);
    border:1px solid var(--hairline);background:var(--surface);
  }
  .hbtn:active{background:var(--surface-2)}
  .h-daynav{display:flex;align-items:center;gap:4px;min-width:0}
  .h-daynav .h-date{font-size:15px;color:var(--muted)}
  .tpl-row .h-daynav{margin-right:2px}
  .h-actions{display:flex;gap:6px;flex:none}
  .hn-btn.sm{width:28px;height:28px;font-size:15px}
  .hn-btn svg{width:16px;height:16px}
  .hn-edit{flex:none;font-size:10.5px;font-weight:600;color:var(--primary)}

  .tpl-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;
    border:1px solid var(--hairline);background:var(--surface);
    font-size:12px;color:var(--muted);
  }
  .chip.solid{background:var(--wash);border-color:transparent;color:var(--primary-ink);font-weight:500}
  button.chip{font-family:inherit;cursor:pointer;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
  .chip-btn{color:var(--primary);font-weight:500;font-size:12px;padding:4px 4px}

  .summary{
    margin-top:7px;
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:.02em;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .summary b{color:var(--ink);font-weight:500}

  /* ---------- banner ---------- */
  .banner{
    display:flex;align-items:center;gap:10px;
    margin:12px 14px 0;
    padding:9px 11px;
    background:var(--wash);
    border-radius:10px;
    font-size:11.5px;color:var(--primary-ink);
  }
  .banner button{
    margin-left:auto;flex:none;
    font-size:11.5px;font-weight:600;color:var(--primary-ink);
    text-decoration:underline;text-underline-offset:2px;
  }

  main{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:4px 14px 24px;
  }
  main.has-fab{padding-bottom:80px}
  .sec-title{
    font-family:var(--font-display);
    font-weight:600;font-size:12px;
    color:var(--muted);
    margin:15px 2px 6px;
    letter-spacing:.02em;
  }
  .sec-title:first-child{margin-top:10px}
  .sec-title-add{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sec-title-add .btn.tiny{flex:none}

  /* ---------- timeline ---------- */
  .tl{position:relative;margin-top:4px}
  .tl::before{
    content:"";position:absolute;left:50px;top:7px;bottom:7px;
    width:1px;background:var(--hairline);
  }
  .tl-row{position:relative;isolation:isolate;display:grid;grid-template-columns:46px 1fr;gap:0;padding:4px 0}
  .tl-time{
    position:relative;z-index:1;
    font-family:var(--font-mono);font-size:12px;white-space:nowrap;
    color:var(--muted);text-align:right;padding-right:14px;padding-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .tl-row.tick{padding:0}
  .tl-row.tick .tl-time{color:var(--faint);padding-top:0;line-height:1.5}
  .tl-row.tick .tl-node.dot{width:4px;height:4px;border:none;background:var(--hairline);top:6px}
  .tl-row.tick .tl-body{min-height:36px}
  .tl-hint{font-size:11.5px;color:var(--faint);margin:2px 2px 8px}

  /* current-time marker */
  .tl-row.now{padding:3px 0}
  .tl-row.now .tl-time{color:var(--primary);font-weight:700;padding-top:0}
  .tl-row.now .tl-node.nowdot{
    width:9px;height:9px;border:none;background:var(--primary);top:5px;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent);
  }
  .tl-row.now .now-line{display:block;height:2px;border-radius:1px;background:var(--primary);margin-top:5px}

  /* one time label, several items stacked under it */
  .tl-node.block-node{width:7px;height:7px;border-width:1.5px;border-color:var(--faint)}
  .tl-blocklabel{color:var(--muted);font-size:12px;padding:1px 0}
  .tl-blocklabel.split-shift{margin-top:10px}
  .blk-end{color:var(--faint);font-size:11px}
  .mk-label{
    color:var(--muted);font-size:12px;font-family:inherit;
    text-decoration:underline;text-decoration-color:var(--hairline);text-underline-offset:3px;
  }
  .mk-label:active{color:var(--ink)}
  .mk-note{
    margin-top:2px;font-size:11px;color:var(--faint);line-height:1.5;
    white-space:pre-wrap;overflow-wrap:anywhere;
  }
  /* duration "band" behind the right side — spans from the start row down to the
     end-time row so you can see where an item finishes (marker + task layers) */
  .span-bg{position:absolute;left:56px;right:0;top:0;bottom:0;z-index:0;pointer-events:none}
  .span-bg--marker{background:color-mix(in srgb,var(--partial) 14%,transparent)}
  /* 開始側も、終了側（.is-cap、下記）と同じ考え方で固定pxにする。以前は
     背中合わせ（前の予定の終了と同じ行で始まる）のときだけ.is-top-halfで
     top:12pxにしてドットに揃えていたが、そうでない単独の開始行では
     .is-topがtop:2pxのままで、ドット（top:9px〜18px）より上まで帯が
     はみ出していた——前後の予定の有無で見え方が変わってしまっていたのを
     v3.95で統一し、常にドットを超えないようにした（.is-top-halfは
     .is-topと同じ値になったため統合して廃止）。 */
  .span-bg.is-top{top:12px;border-top-left-radius:7px;border-top-right-radius:7px}
  .span-bg.is-bot{bottom:2px;border-bottom-left-radius:7px;border-bottom-right-radius:7px}
  /* 終了側は常にこの高さで止める（隣接する予定の有無に関わらず、その時刻の
     ドットを超えて伸びないように）。行の高さに対する割合ではなく固定px にする
     — 割合指定だと、行が高くなる（長い予定名で折り返す等）ほど塗りの高さも
     比例して伸びてしまい、ドットの実際の位置（行の高さに関わらずほぼ一定）を
     超えてしまうことがあったため（v3.50で修正）。 */
  .span-bg.is-cap{top:0;height:9px;bottom:auto;border-bottom-left-radius:7px;border-bottom-right-radius:7px}
  .tl-row.tick.span-end .tl-time{color:var(--muted)}
  .tl-cards{display:flex;flex-direction:column;gap:7px;margin-top:2px}
  .tl-blocklabel + .tl-cards{margin-top:5px}
  .tl-node{
    position:absolute;left:50px;top:9px;transform:translate(-50%,0);
    width:9px;height:9px;border-radius:50%;
    background:var(--surface);border:2px solid var(--muted);
    box-sizing:border-box;z-index:1;
  }
  .tl-row.block .tl-node{width:7px;height:7px;border-width:1.5px;border-color:var(--faint)}

  .tl-row.block .tl-body{color:var(--muted);font-size:12px;padding-top:1px}
  .tl-body{position:relative;z-index:1;padding-left:14px;min-width:0}

  .card{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:11px;
    box-shadow:var(--shadow);
    padding:8px 10px;
  }
  .card.is-set{opacity:.6}
  /* タイムテーブルの状態表示からジャンプしてきたカードの目印。何か操作するまで光り続け、
     操作した時点で state._highlightOccId をクリアしてクラスごと外す */
  .card.flash-highlight{
    border-color:transparent;
    animation:cardGlow 1.4s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{ box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 55%,transparent),
                        0 0 14px 2px color-mix(in srgb,var(--primary) 45%,transparent); }
    50%{ box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 22%,transparent),
                     0 0 4px 1px color-mix(in srgb,var(--primary) 15%,transparent); }
  }
  @media (prefers-reduced-motion:reduce){
    .card.flash-highlight{ animation:none; box-shadow:0 0 0 2px var(--primary); }
  }
  .card-head{display:flex;align-items:baseline;gap:8px}
  /* v3.85: タイトルは1行固定・幅を超えたら「…」で省略。編集ボタン・状態バッジの
     位置がタイトルの長さで動かないようにするため（wrapするとその分ボタン列が
     ずれて見えていた） */
  .card-title{
    font-weight:500;font-size:12.5px;line-height:1.4;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* 編集ボタン・状態バッジは常にこの1組としてまとめて右端に固定
     （タイトルが短くても長くても、ボタン同士の並び・位置は変わらない） */
  .card-head-actions{
    margin-left:auto;flex:none;display:inline-flex;align-items:baseline;gap:6px;
  }
  .card-status{
    flex:none;display:inline-flex;align-items:baseline;gap:3px;
    font-family:var(--font-mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em;
  }
  button.card-status{border:none;background:none;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
  .card-state{
    flex:none;
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;
    padding:2px 6px;border-radius:6px;
    background:var(--surface-2);color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .card-state.done{color:var(--done);background:var(--wash)}
  .card-state.deferred{color:var(--defer)}
  .card-state.todo{color:var(--on-primary);background:var(--primary)}
  .card-meta{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    margin-top:2px;font-size:10.5px;color:var(--faint);
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  }
  .card-meta:empty{display:none}
  .cat{
    font-family:var(--font-body);
    padding:1px 6px;border-radius:6px;
    background:var(--surface-2);color:var(--muted);font-size:10px;
  }
  .note-toggle{font-family:var(--font-body);font-size:10.5px;font-weight:600;color:var(--primary);padding:0 2px}
  .card-note{
    margin-top:5px;font-size:12px;color:var(--muted);line-height:1.55;
    white-space:pre-wrap;overflow-wrap:anywhere;
    background:var(--surface-2);border-radius:7px;padding:6px 8px;
  }
  /* per-occurrence memo（進捗メモ。以前の「一部実施」のメモの後継） */
  .card-onote{
    margin-top:5px;font-size:11.5px;color:var(--muted);line-height:1.5;
    white-space:pre-wrap;overflow-wrap:anywhere;
    padding-left:8px;border-left:2px solid var(--hairline);
  }
  /* v3.100: タスクタブで「今日」以外の日の進捗メモを表示するときに付ける日付ラベル */
  .po-date{color:var(--faint);font-family:var(--font-mono);font-size:10px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:32px;padding:5px 12px;border-radius:8px;
    font-size:12px;font-weight:500;line-height:1;
    border:1px solid var(--hairline);background:var(--surface);color:var(--ink);
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .btn.ghost{border-color:transparent;color:var(--muted)}
  .btn.tiny{min-height:26px;padding:3px 9px;font-size:11px}

  .untimed{display:flex;flex-direction:column;gap:7px;margin-top:4px}

  .empty{
    text-align:center;color:var(--faint);font-size:12px;
    padding:26px 18px;border:1px dashed var(--hairline);border-radius:11px;margin-top:6px;
  }

  /* ---------- FAB (absolute inside the app frame) ---------- */
  /* v3.110: bottom値が固定pxだった。.tabbarは env(safe-area-inset-bottom) の
     ぶんだけ高さが伸びる（ホームインジケーターのある実機で顕著）が、この
     固定値はそれを考慮していなかったため、自前ホスト後に実機（Artifactの
     ラッパー内では起きなかった）で＋ボタンがタブバーに埋もれる不具合が
     出た。.tabbarと同じ分だけ底上げする。 */
  .fab{
    position:absolute;right:14px;bottom:calc(64px + env(safe-area-inset-bottom,0));z-index:30;
    width:48px;height:48px;border-radius:15px;
    background:var(--primary);color:var(--on-primary);
    display:grid;place-items:center;
    box-shadow:0 4px 16px rgba(22,32,29,.22);
  }
  .fab svg{width:20px;height:20px}
  .fab-menu{
    position:absolute;right:14px;bottom:calc(120px + env(safe-area-inset-bottom,0));z-index:30;
    display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  }
  /* v3.112: .fab/.fab-menu が自前で display:grid/flex を指定していたため、
     HTMLの hidden 属性（ブラウザ標準では [hidden]{display:none}）がこの
     クラスの指定に負けて効かなくなっていた——closeFab()でFABM.hidden=true
     にしても見た目には何も起きず、メニューが画面に残り続ける不具合の原因。
     hidden指定時だけ確実にdisplay:noneで上書きする。 */
  .fab[hidden], .fab-menu[hidden]{ display:none; }
  .fab-menu button{
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:500;
    box-shadow:var(--shadow);
  }

  /* ---------- toast ---------- */
  #toast{
    position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0));transform:translateX(-50%);
    background:var(--ink);color:var(--ground);
    font-size:12px;font-weight:500;padding:8px 14px;border-radius:9px;
    box-shadow:0 4px 16px rgba(22,32,29,.22);z-index:40;white-space:nowrap;
    animation:toastin .18s ease;
  }
  @keyframes toastin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---------- today outlook ---------- */
  .outlook{
    border:1px solid var(--hairline);border-radius:12px;background:var(--surface);
    box-shadow:var(--shadow);padding:10px 12px;margin-top:10px;
  }
  .outlook .ol-head{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12px}
  .outlook .ol-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--defer)}
  .outlook .ol-dot.ok{background:var(--done)}
  .outlook .ol-dot.tight{background:var(--partial)}
  .outlook .ol-dot.over{background:var(--over)}
  .outlook .ol-text{font-size:11.5px;color:var(--muted);margin-top:4px}
  .outlook .ol-risk{font-size:11.5px;color:var(--ink);margin-top:6px;padding-left:12px;position:relative;line-height:1.5}
  .outlook .ol-risk::before{content:"›";position:absolute;left:2px;color:var(--primary)}
  .outlook .acts{margin-top:9px}

  /* ---------- insights (傾向) ---------- */
  .ins-intro{font-size:11.5px;color:var(--muted);margin:8px 2px 0}
  .ins-card{
    border:1px solid var(--hairline);border-radius:12px;background:var(--surface);
    box-shadow:var(--shadow);padding:13px;margin-top:12px;
  }
  .ins-card h3{font-family:var(--font-display);font-weight:600;font-size:13px;margin:0 0 7px}
  .ins-card p{margin:5px 0;font-size:12px;color:var(--muted)}
  .ins-card p strong{color:var(--ink);font-weight:600}
  .ins-bar{display:grid;grid-template-columns:52px 1fr 38px;gap:8px;align-items:center;margin:4px 0;font-size:10.5px;font-family:var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .ins-bar .ib-track{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
  .ins-bar .ib-track i{display:block;height:100%;border-radius:4px;background:var(--primary)}
  .ins-bar .ib-track i.low{background:var(--over)}
  .ins-bar .ib-track i.mid{background:var(--partial)}
  .ins-note{font-size:11.5px;color:var(--ink);margin-top:9px;background:var(--wash);border-radius:8px;padding:8px 10px;line-height:1.55}

  /* ---------- tab bar (bottom flex child — always visible) ---------- */
  .tabbar{
    flex:none;z-index:2;
    display:grid;grid-template-columns:repeat(4,1fr);
    background:var(--ground);
    border-top:1px solid var(--hairline);
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 0 8px;color:var(--faint);font-size:9.5px;font-weight:500;
  }
  .tab span{white-space:nowrap}
  .tab svg{width:20px;height:20px}
  .tab.active{color:var(--primary)}

  /* ---------- notes view ---------- */
  .note-item{
    display:block;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--hairline);border-radius:10px;
    padding:10px 12px;box-shadow:var(--shadow);margin-bottom:7px;
  }
  .note-item .nt-title{
    font-weight:600;font-size:13px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .note-item .nt-prev{
    font-size:11.5px;color:var(--muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .note-item .nt-date{font-family:var(--font-mono);font-size:10px;color:var(--faint);margin-top:4px}
  /* ---------- 覚え書き（v3.97〜。タスクタブの3つ目の切替として追加。
     「明確に継続するわけでも単発で終わるわけでもない、意識しておきたい
     こと」を、開かなくても全文が常に見える形で並べる。メモ（notes）とは
     別の独立したデータ（db.remarks）——ユーザーの指示で「もともとある
     メモとは別物」にしている） ---------- */
  .remark-item{
    display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--hairline);border-radius:10px;
    padding:10px 12px;box-shadow:var(--shadow);margin-bottom:7px;
  }
  /* v3.103: 表示期間外に送られた覚え書きだと分かるよう少し薄くする（並び順で
     下に送られるのに加え、見た目でも区別する） */
  .remark-item.rm-dim{opacity:.55}
  .remark-item .rm-text{
    font-size:12.5px;color:var(--ink);line-height:1.6;
    white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .remark-item .rm-date{
    font-family:var(--font-mono);font-size:10px;color:var(--faint);
  }
  /* v3.104: 重要度チップを本文の下、表示期間キャプションと同じ行の一番左に
     移動（ユーザーの指示による）。表示期間が無いときはチップだけが並ぶ。 */
  .remark-item .rm-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .note-editor{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .note-editor .ne-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);display:flex;gap:10px;align-items:baseline}
  .note-editor .ne-del{font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--over)}
  .note-editor .ne-title{
    width:100%;border:1px solid var(--hairline);border-radius:11px;background:var(--surface);
    padding:10px 12px;font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--ink);
  }
  .note-editor textarea{
    width:100%;min-height:56vh;
    border:1px solid var(--hairline);border-radius:11px;background:var(--surface);
    padding:12px;font-family:var(--font-body);font-size:16px;line-height:1.7;
    color:var(--ink);resize:vertical;
  }

  /* ---------- tasks view ---------- */
  .grp-head{
    display:flex;align-items:baseline;gap:8px;
    margin:16px 2px 7px;
  }
  .grp-head h3{font-family:var(--font-display);font-weight:600;font-size:13.5px;margin:0}
  .grp-head span{font-family:var(--font-mono);font-size:11px;color:var(--faint)}
  .due-head{
    display:flex;align-items:baseline;gap:6px;
    margin:15px 2px 6px;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--faint);
  }
  .due-head span{font-family:var(--font-mono);font-size:10px}
  .due-head.over{color:var(--over)}
  .tasklist + .due-head{margin-top:16px}
  .tasklist{display:flex;flex-direction:column;gap:7px}
  .task-item{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:10px;padding:9px 11px;box-shadow:var(--shadow);width:100%;text-align:left;
  }
  .ti-meta-row{display:flex;align-items:center;gap:6px;margin-top:3px}
  .ti-meta-row .ti-meta{margin-top:0}
  .task-item .ti-name{font-weight:500;font-size:12.5px}
  .task-item .ti-meta{
    margin-top:3px;font-family:var(--font-mono);font-size:10.5px;color:var(--faint);
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-variant-numeric:tabular-nums;
  }
  .ti-cat{
    font-family:var(--font-body);font-size:10px;color:var(--muted);
    padding:1px 6px;border-radius:6px;
    background:var(--surface-2);border:1px solid var(--hairline);
  }
  .ti-note, .cd-note{
    margin-top:3px;font-size:11px;color:var(--faint);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .ti-freq{
    flex:none;font-family:var(--font-mono);font-size:10.5px;
    color:var(--primary-ink);background:var(--wash);
    padding:2px 7px;border-radius:6px;
  }
  .ti-freq.met{color:var(--faint);background:var(--surface-2)}
  /* 種類（スキル／ルーティン）は分類のためだけの表示なので、選んだ内容によって
     色を変えたりしない — どちらも同じ地味な見た目（カテゴリと同系統）にする */
  .ti-rtype{
    flex:none;font-family:var(--font-body);font-size:10px;
    padding:1px 6px;border-radius:6px;
    background:var(--surface-2);border:1px solid var(--hairline);color:var(--muted);
  }
  .ti-due{color:var(--muted)}
  .ti-due.soon{color:var(--partial);font-weight:600}
  .ti-due.over{color:var(--over);font-weight:600}
  .ti-prio{
    font-family:var(--font-body);font-size:10px;font-weight:600;
    padding:1px 6px;border-radius:6px;
    background:var(--surface-2);border:1px solid var(--hairline);color:var(--muted);
  }
  .ti-prio.high{color:var(--over);border-color:color-mix(in srgb,var(--over) 40%,transparent)}
  .ti-prio.mid{color:var(--partial);border-color:color-mix(in srgb,var(--partial) 40%,transparent)}
  .ti-prio.low{font-weight:400;color:var(--muted)}
  .ti-start{color:var(--faint)}
  /* 完了型タスク行のメタ: 重要度 / 開始 / 期限 / カテゴリ を固定幅で並べる。
     日付の桁数が変わっても各枠の位置・幅が全タスクで揃うよう、grid の列幅を固定する。
     grid3 は ToDoリストのカード用（v3.67〜）— カテゴリを省いた重要度/開始/期限の3列。 */
  .ti-meta.grid4{
    display:grid;grid-template-columns:40px 72px 72px 44px;
    gap:3px;align-items:center;justify-content:start;overflow:hidden;
  }
  .ti-meta.grid3{
    display:grid;grid-template-columns:40px 72px 72px;
    gap:3px;align-items:center;justify-content:start;overflow:hidden;
  }
  .ti-meta.grid4 > *, .ti-meta.grid3 > *{min-width:0}
  .ti-meta.grid4 .tf-prio, .ti-meta.grid3 .tf-prio{display:block}
  .ti-meta.grid4 .tf-prio > .ti-prio, .ti-meta.grid3 .tf-prio > .ti-prio{
    display:block;text-align:center;padding:1px 2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ti-meta.grid4 .ti-cat{
    display:block;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ti-field{
    font-family:var(--font-body);font-size:10px;
    padding:1px 4px;border-radius:6px;
    background:var(--surface-2);border:1px solid var(--hairline);
    display:flex;justify-content:space-between;gap:3px;min-width:0;
  }
  .ti-field .tf-l{color:var(--faint);flex:none}
  .ti-field .tf-v{color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ti-field.over{border-color:color-mix(in srgb,var(--over) 40%,transparent)}
  .ti-field.over .tf-v{color:var(--over);font-weight:600}
  .ti-field.soon{border-color:color-mix(in srgb,var(--partial) 40%,transparent)}
  .ti-field.soon .tf-v{color:var(--partial);font-weight:600}

  /* ---------- history view ---------- */
  .seg{
    display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;margin:2px 0 8px;
  }
  .seg button{
    padding:5px 13px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted);
  }
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  /* v3.82: タイムテーブル／ToDoリストの切替タブ。選ばれている方は、常設の
     今日の日付表示（.h-nowdate）と同じ枠線＋発光の表現で強調する。 */
  .view-seg button.on{
    border:1px solid var(--primary);
    box-shadow:0 0 4px 0 color-mix(in srgb, var(--primary) 40%, transparent);
  }
  .today-seg{
    display:flex;position:sticky;top:0;z-index:5;
    margin:0 -14px 6px;padding:8px 14px;
    background:var(--ground);border-bottom:1px solid var(--hairline);
    box-shadow:0 -8px 0 var(--ground);   /* cover the few px of scroll above it */
  }
  .today-seg button{flex:1;text-align:center}
  .tasks-add{
    position:sticky;top:0;z-index:5;
    margin:0 -14px 8px;padding:8px 14px;
    background:var(--ground);border-bottom:1px solid var(--hairline);
    box-shadow:0 -8px 0 var(--ground);
  }
  .seg-badge{
    display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;
    border-radius:8px;background:var(--primary);color:var(--on-primary);
    font-family:var(--font-mono);font-size:10px;font-weight:700;line-height:16px;
    text-align:center;vertical-align:1px;
  }
  .lc-group-label{
    font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--faint);
    margin:6px 2px 6px;
  }
  .lc-group-label + .lc-group-label,
  .untimed + .lc-group-label{
    margin-top:14px;padding-top:10px;border-top:1px solid var(--hairline);
  }
  /* 「未完了／済み」の下でさらに「時間未定／時間あり」を分ける小見出し
     （時間未定を先に出す） */
  .lc-subgroup-label{
    font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--faint);
    opacity:.8;margin:8px 2px 4px;
  }
  .untimed + .lc-subgroup-label{ margin-top:12px }

  .hist-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
  .hn-label{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .hn-btn{
    width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--hairline);
    background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:17px;line-height:1;
  }
  .hn-btn:disabled{opacity:.32}

  .rollup{
    background:var(--surface);border:1px solid var(--hairline);border-radius:11px;
    padding:12px;box-shadow:var(--shadow);margin-bottom:8px;
  }
  .rollup-row{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:10px;padding:5px 0}
  .rollup-row .rl-cat{font-size:11.5px;color:var(--muted)}
  .rollup-row .rl-bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
  .rollup-row .rl-bar i{display:block;height:100%;background:var(--primary);border-radius:4px}
  .rollup-row .rl-val{
    font-family:var(--font-mono);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .hist-day{margin-top:14px}
  .hist-h{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-family:var(--font-mono);font-size:12px;color:var(--muted);
    border-bottom:1px solid var(--hairline);padding-bottom:5px;margin-bottom:6px;
    font-variant-numeric:tabular-nums;
  }
  .hist-grp{margin:6px 0}
  .hist-grp .hg-label{font-size:10.5px;color:var(--faint);margin-bottom:3px}
  .hist-row{
    display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:12px;
  }
  .hist-row .hr-mark{color:var(--done);flex:none;font-family:var(--font-mono);font-size:12px}
  .hist-row.skipped .hr-mark{color:var(--defer)}
  .hist-row .hr-note{color:var(--faint);font-size:11px}
  .hist-row .hr-min{
    margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--faint);
    font-variant-numeric:tabular-nums;
  }
  .hist-more{margin-top:26px;padding-top:4px}

  /* ---------- settings view ---------- */
  .set-block{
    background:var(--surface);border:1px solid var(--hairline);border-radius:11px;
    padding:13px;box-shadow:var(--shadow);margin-top:13px;
  }
  .set-block h3{font-family:var(--font-display);font-weight:600;font-size:13px;margin:0 0 4px}
  .set-block p{margin:0 0 10px;font-size:11.5px;color:var(--muted)}
  .set-c:not(.open){padding:11px 13px}
  .set-c > .set-head{
    width:100%;text-align:left;display:flex;align-items:center;gap:9px;
    font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink);
  }
  .set-c .set-caret{color:var(--muted);font-size:9px;flex:none;width:9px;line-height:1}
  .set-c-body{margin-top:9px}
  .set-c-body p:first-child{margin-top:0}
  .set-c-body p:last-of-type{margin-bottom:8px}
  .tpl-pick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
  .tpl-editor{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .tpl-rec-tag{
    font-family:var(--font-body);font-size:10px;color:var(--primary-ink);
    background:var(--wash);padding:1px 6px;border-radius:6px;margin-left:6px;
  }
  .tpl-line{
    display:grid;grid-template-columns:1fr 26px;gap:7px 8px;align-items:center;
    padding:8px 0;border-bottom:1px dashed var(--hairline);
  }
  .tpl-line input[data-f]{
    height:38px;min-height:38px;padding:0 8px;box-sizing:border-box;line-height:normal;
  }
  .tpl-name{font-weight:500}
  .tpl-task-line .tt-name{
    font-weight:500;font-size:12.5px;align-self:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .tpl-line input[data-f="time"], .tpl-line input[data-f="end"]{font-family:var(--font-mono)}
  .tpl-line .tl-r2{
    grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    font-size:12px;color:var(--muted);margin-top:2px;
  }
  .tpl-line .tl-r2 label{display:flex;align-items:center;gap:5px;flex:none}
  .tpl-line .tl-r2 .tl-sep{flex:none;color:var(--faint)}
  .tpl-line .tl-r2 input[type="time"]{height:32px;width:74px;flex:none}
  .tpl-line .tl-r2 input[type="number"]{height:32px;width:44px;flex:none}
  .tpl-line .tl-r2 input[type="checkbox"]{width:18px;height:18px}
  /* 開始〜終了・所要 を1行に収める共通レイアウト（シート用） */
  .time-row{display:flex;gap:6px;align-items:center;margin-top:4px}
  .time-row .tr-sep{flex:none;color:var(--faint);font-size:12px}
  .time-row input[type="time"]{height:38px;min-height:38px;width:82px;padding:0 6px;box-sizing:border-box;flex:none;font-family:var(--font-mono)}
  .time-row input[type="number"]{height:38px;min-height:38px;width:52px;padding:0 6px;box-sizing:border-box;flex:none}

<script>
"use strict";
/* ============================================================
   LifeCore v1
   - 予定 / ToDo / 実績 をひとつのデータで扱う個人用プランナー
   - 保存: localStorage（即時・オフライン）＋ Artifact のアカウント連動DB
     （スマホ⇔PC 同期・アプリ更新でも保持。月ごとに分割保存）
   - 詳しい仕組みは docs/01-manual.md
   ============================================================ */

const KEY = "lifecore.v1";
const APP_VERSION = "3.137";   // shown in 設定 so we can tell which build each device is running
/* v3.0 — model split: タスク (checkable, has history) vs 予定 (time context, no
   check). 食事 is now a 継続型 task. Templates hold 予定 rows + task placements.
   完了型 tasks gained 重要度 / 開始時期. Old data is upgraded by migrate(). */

/* On-screen debug log — shown in 設定, so problems can be read without DevTools */
const debugLog = [];
function dbg(){
  const line = [].map.call(arguments, a=>{
    try{ return (typeof a === "string") ? a : JSON.stringify(a); }catch(e){ return String(a); }
  }).join(" ");
  debugLog.push(new Date().toLocaleTimeString() + "  " + line);
  while(debugLog.length > 40) debugLog.shift();
  try{ console.log(line); }catch(e){}
}
try{
  window.addEventListener("error", e=>{ dbg("ERROR:", e.message, "@", (e.filename||"").split("/").pop()+":"+(e.lineno||"?")); });
  window.addEventListener("unhandledrejection", e=>{ dbg("REJECT:", (e.reason && e.reason.message) || String(e.reason)); });
}catch(e){}
/* Account-linked DB sync — being re-introduced in steps after an earlier
   version froze the UI. SYNC_STEP limits how far initDB() goes so a bad step
   can be pinpointed and rolled back:
     1 = acquire db namespace + one read only (no writes, no subscribe, no swap)
     2 = + first-time push of this device's data
     3 = + adopt existing DB data as source of truth
     4 = + live subscription (cross-device) */
const SYNC_ENABLED = true;
const SYNC_STEP = 3;
const WD = ["日","月","火","水","木","金","土"];
const CATS = ["生活","勉強","運動","家事","食事","趣味","仕事","その他"];

/* ---------- utils ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID().slice(0,8) : Math.random().toString(36).slice(2,10));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDstr = s => { const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); };
const addDays = (s,n) => { const d = parseDstr(s); d.setDate(d.getDate()+n); return dstr(d); };
/* The "schedule day" starts at 04:00 — if you're up past midnight the app still
   treats it as the same day (shown as 24:00–27:59 on the timeline). So "今日"
   only rolls over at 4am, and 00:00–03:59 belongs to the day that just ended. */
const NIGHT_END_HOUR = 4;
const scheduleDay = dt => { const x = new Date(dt); if(x.getHours() < NIGHT_END_HOUR) x.setDate(x.getDate()-1); return dstr(x); };
const todayStr = () => scheduleDay(new Date());
/* dates are always stored with the year (YYYY-MM-DD). Display shows the year only
   when it isn't the current year, so long-term history stays unambiguous. */
const fmtDateJP = s => {
  const d = parseDstr(s), y = d.getFullYear();
  const yr = y !== new Date().getFullYear() ? `${y}年` : "";
  return `${yr}${d.getMonth()+1}月${d.getDate()}日 (${WD[d.getDay()]})`;
};
const fmtDateShort = s => {
  const d = parseDstr(s), y = d.getFullYear();
  const yr = y !== new Date().getFullYear() ? `${y}/` : "";
  return `${yr}${d.getMonth()+1}/${d.getDate()} ${WD[d.getDay()]}`;
};
/* ヘッダー常設の「今の実際の日付」表示（v3.37）専用。スケジュールの「4時で日付が
   切り替わる」仕様とは無関係に、今この瞬間の暦の上での日付をそのまま出す
   （todayStr()/scheduleDay() は使わない — あれは深夜のスケジュール表示専用のルール）。 */
const fmtNowDate = () => {
  const d = new Date();
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}(${WD[d.getDay()]})`;
};
/* v3.38（お試し）: ヘッダーの日付表示の右に24時間表記の現在時刻も出す */
const fmtNowTime = () => {
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
/* スケジュール画面のテンプレ選択チップ用: 5文字以上なら4文字＋「…」に省略する */
const tplNameShort = name => (name && name.length >= 5) ? name.slice(0,4) + "..." : (name || "");
/* schedule day = 00:00 → 28:00; 00:00–03:59 counts as "last night" → 24:00–27:59 */
const timeKey = t => { if(!t) return 1e9; let [h,m]=t.split(":").map(Number); if(h<NIGHT_END_HOUR) h+=24; return h*60+m; };
const keyToLabel = key => `${pad(Math.floor(key/60))}:${pad(key%60)}`;   // 00:00 .. 28:00 (25時表記)
/* v3.122: 「ひと段落」機能用。keyToLabel()は24時超え表記の"表示専用"で実在
   しない時刻（26:00等）になりうるため、plannedStartへ保存する実時刻には
   使えない——durFromEnd()等と同じ%1440の折り返しで実時刻に変換する専用の
   ヘルパーを分ける。 */
const keyToTime = key => { const t = ((key % 1440) + 1440) % 1440; return `${pad(Math.floor(t/60))}:${pad(t%60)}`; };
const HD_BEDTIME_KEY = 25*60;   // 「ひと段落」提案の終端＝就寝固定25:00（設定化はv1では見送り）
const HD_DEFAULT_MIN = 30;      // estMin未設定のスキル系タスクに使うフォールバック所要時間
const fmtDur = min => min < 60 ? `${min}分` : `${Math.floor(min/60)}時間${min%60 ? (min%60)+"分" : ""}`;
/* start "HH:MM" + minutes -> end "HH:MM" (24h, wraps past midnight) */
const endFromDur = (start, min) => { const t = (timeKey(start) + min) % 1440; return `${pad(Math.floor(t/60))}:${pad(t%60)}`; };
/* start + end "HH:MM" -> minutes (wraps; 09:00→17:00 = 480, 23:00→01:00 = 120) */
const durFromEnd = (start, end) => (((timeKey(end) - timeKey(start)) % 1440) + 1440) % 1440;
/* sort template rows by time, and at the same time put 記録なし before 記録あり */
const sortBlocks = blocks => blocks.sort((a,b)=>
  (timeKey(a.time)-timeKey(b.time)) || ((a.track?1:0)-(b.track?1:0)));
/* completion timestamp: real 'now' for today, noon-of-that-day for a back-dated fix */
const stamp = dateStr => dateStr===todayStr() ? new Date().toISOString() : dateStr+"T12:00:00";

function weekStart(s){ const d=parseDstr(s); const g=d.getDay(); const diff=(g===0?-6:1-g); return addDays(s,diff); }
function inRange(s,a,b){ return s>=a && s<=b; }

/* ============================================================
   STORE  —  in-memory model `db` is the app's single shape.
   Persistence has two layers:
     • localStorage  : instant, offline cache + backup (always on)
     • Artifact DB    : account-linked, syncs phone <-> PC, survives
                        app updates. Sharded by month so it lasts
                        decades (5,000-doc cap, 256KiB/doc).
       core/main        -> { version, meta, settings, templates, tasks }
       months/<YYYY-MM> -> { month, occ:[...], dayMeta:{date:{...}} }
   ============================================================ */
// v3.88: この端末の保存データが読み込めずサンプルへフォールバックした
// ことを、あとでトースト表示できるように覚えておくフラグ（loadLocal() が
// 中で読み書きするため、loadLocal() の呼び出しより前に必ず宣言しておく
// 必要がある — let は巻き上げされないため）。TOAST 要素はこの時点では
// まだ用意できていない（スクリプトの後半で定義される）ので、起動処理の
// 最後で拾って表示する。
let localLoadIssue = null;   // null | "corrupt"
// v3.92: 2026-09-19〜20にかけて実際に発生した事故（v3.86時点の不具合で、
// サンプルのタスク・実施がこの端末のローカルデータに紛れ込んだ）の後始末。
// クラウド側は直接削除したが、この端末側に汚染済みのコピーが残っていると、
// 次の同期でマージにより汚染がクラウドへ書き戻ってしまう（実際に発生）。
// 該当する項目は id が既知（下記の固定リスト）なので、migrate()（loadLocal()
// より前に必ず宣言しておく必要がある — let/const は巻き上げされないため）
// で毎回確実に取り除く。新しく作る本物のタスクは毎回 uid() で新しいidが
// 振られるため、このリストと衝突することはない。十分な期間が経ち、この
// 端末側の汚染データが一巡して消えたと判断できたら、このブロックごと
// 削除してよい。
const CONTAMINATED_TASK_IDS = new Set([
  "0e066a0a","6ca52970","de034bc5","b7d93ef3","bd1e3de8","4c90888d","5577b559","1d564984","0de1a48a",
  "07858496","24446b30","5602f258","b269b4a8","7ffaf36e","06df156f","c9221e46","a94c6bc0","2acda6e8",
]);
let db = loadLocal();
let state = { tab:"today", todayView:"timeline", tplView:"timeline", tasksView:"single", taskSort:"default", pickView:"single", pickSort:"default", noteId:null, date: todayStr(), histSpan:"day", histDate: todayStr(), histView:"records", settingsTplId:null, _setOpen:new Set(), _noteOpen:new Set(), _tplDraft:null, _highlightOccId:null };

let DB = null;                // Artifact DB namespace, or null (offline / not on claude.ai)
let dbReady = false;
let syncMode = "local";       // local | synced | error | quota
let applyingRemote = false;
let lastPushed = null;        // { coreStr, monthStrs } for diff-on-flush
let pushTimer = null, remoteTimer = null;
let pushing = false, pushPending = false;
let localSaveOk = true;   // false while this device's own localStorage writes are failing
                          // (e.g. quota exceeded) — surfaced in 設定 so it isn't silent

function loadLocal(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      try{
        const d = JSON.parse(raw);
        if(!d.settings) d.settings = { showOutlook:true };
        return migrate(d);
      }catch(e){
        console.warn("local parse/migrate failed — falling back to sample", e);
        try{ localStorage.setItem(KEY + ".corrupt", raw); }catch(e2){}
        localLoadIssue = "corrupt";
      }
    }
  }catch(e){ console.warn("local load failed", e); }
  return migrate(seed());
}
const settings = () => (db.settings || (db.settings = { showOutlook:true }));

/* ---- v3.0 model migration (idempotent) ----
   old: templates have `blocks` (track:true = 食事 / track:false = 固定枠);
        occurrences use `meal` and `marker` flags.
   new: templates have `plans` (時間の文脈, no check) + `tasks` (registered-task
        placements); 食事 is a 継続型 task; single-day 予定 = occ with `plan:true`. */
function migrate(d){
  if(!d || typeof d !== "object") return d;
  d.tasks = d.tasks || [];
  d.templates = d.templates || [];
  d.occurrences = d.occurrences || [];
  d.notes = d.notes || [];
  d.remarks = d.remarks || [];   // v3.97: 覚え書き（メモとは別の独立データ）
  // v3.103: 重要度・表示期間を追加。旧データ（この2つを持たない）には既定値
  // を補う——重要度は完了型タスクと同じ既定「無」、表示期間は「指定なし」。
  d.remarks.forEach(r=>{
    if(r.prio == null) r.prio = "low";
    if(r.showFrom === undefined) r.showFrom = null;
    if(r.showTo === undefined) r.showTo = null;
  });
  if(d.tasks.some(t=>CONTAMINATED_TASK_IDS.has(t.id))) d.tasks = d.tasks.filter(t=>!CONTAMINATED_TASK_IDS.has(t.id));
  if(d.occurrences.some(o=>o.taskId && CONTAMINATED_TASK_IDS.has(o.taskId))) d.occurrences = d.occurrences.filter(o=>!(o.taskId && CONTAMINATED_TASK_IDS.has(o.taskId)));
  // find or make a daily 継続型 task by name (former template 食事 rows / meal occ)
  const namedRepeat = name => {
    let t = d.tasks.find(x=>x.name===name && x.kind==="repeat");
    if(!t){
      t = { id:uid(), name, kind:"repeat", freq:{type:"daily"}, estMin:null,
            category:"食事", note:"", due:null, prio:"low", startDate:null,
            rtype:"routine", done:false, createdAt: todayStr() };
      d.tasks.push(t);
    }
    return t;
  };
  d.templates.forEach(tpl=>{
    if(Array.isArray(tpl.blocks) && !Array.isArray(tpl.plans)){
      tpl.plans = [];
      tpl.tasks = Array.isArray(tpl.tasks) ? tpl.tasks : [];
      tpl.blocks.forEach(b=>{
        if(b.track){
          const rt = namedRepeat(b.label || "食事");
          tpl.tasks.push({ taskId: rt.id, time: b.time, mins: b.mins || null });
        } else {
          tpl.plans.push({ time:b.time, label:b.label, mins:b.mins || null, category:b.category || "" });
        }
      });
      delete tpl.blocks;
    }
    tpl.plans = tpl.plans || [];
    tpl.tasks = tpl.tasks || [];
  });
  d.occurrences.forEach(o=>{
    if(o.marker){ o.plan = true; if(o.status==="marker") o.status = "plan"; delete o.marker; }
    if(o.meal){
      const rt = namedRepeat(o.title || "食事");
      o.taskId = rt.id;
      o.title = null;
      delete o.meal;
    }
    // v3.66: 一部実施（status:"partial"）を廃止。以前のデータは「未完了」に戻す
    // ——メモ（進捗の記録）はそのまま残るので、記録していた内容は失われない。
    if(o.status==="partial"){ o.status = "planned"; o.actualMin = null; o.doneAt = null; }
  });
  d.tasks.forEach(t=>{
    if(t.prio == null) t.prio = "low";
    if(t.startDate === undefined) t.startDate = null;
    if(t.duePrec == null) t.duePrec = "day";
    if(t.startPrec == null) t.startPrec = "day";
    if(t.kind==="repeat" && t.rtype == null) t.rtype = "routine";
  });
  // v3.102: v3.100で進捗メモの参照先を「今日の実施」から「一番新しい実施」に
  // 変えたが、それより前（またはv3.101のcarry-forward修正が効く前）に空の
  // noteで作られてしまった実施が既にこの端末に残っていると、その修正だけでは
  // 直らない（新しく作る実施にしか効かないため）——実際に「進捗メモが消えた」
  // という報告があった。起動のたびに、完了型タスクの「一番新しい実施のnoteが
  // 空なのに、それより前の実施にnoteが残っている」というパターンを見つけて
  // 引き継ぐ、一度きりの自動修復を行う。
  d.tasks.forEach(t=>{
    if(t.kind!=="single") return;
    const occs = d.occurrences.filter(o=>o.taskId===t.id && !o.plan).sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    if(occs.length < 2) return;
    const latest = occs[occs.length-1];
    if(latest.note) return;
    for(let i=occs.length-2;i>=0;i--){
      if(occs[i].note){ latest.note = occs[i].note; break; }
    }
  });
  d.notes.forEach(n=>{ if(n.title == null) n.title = ""; });
  // v3.49: テンプレの予定（plans）は、テンプレを直接読むのではなく適用時に
  // その日専用の occurrence としてコピーする方式に変更した。この変更より前に
  // 適用されていた日（tplPlansCopied が付いていない日）だけ、現在のテンプレの
  // 中身から一度だけコピーを補う。`tplPlansCopied` を付けたら、以後ユーザーが
  // コピーぶんを削除しても migrate() が復活させることはない。
  d.dayMeta = d.dayMeta || {};
  Object.entries(d.dayMeta).forEach(([date, m])=>{
    if(!m || !m.templateId || m.tplPlansCopied) return;
    const tpl = d.templates.find(t=>t.id===m.templateId);
    if(tpl){
      (tpl.plans||[]).forEach(b=>{
        d.occurrences.push({
          id:uid(), taskId:null, date, title:b.label||"", plan:true,
          plannedStart:b.time||null, plannedMin:b.mins||null, category:b.category||"その他",
          actualMin:null, status:"plan", doneAt:null, adhoc:false, note:"", fromTpl:true,
        });
      });
    }
    m.tplPlansCopied = true;
  });
  return d;
}

function saveLocal(){
  try{
    db.meta = db.meta || {};
    db.meta.savedAt = new Date().toISOString();
    localStorage.setItem(KEY, JSON.stringify(db));
    if(!localSaveOk){ localSaveOk = true; dbg("[local] save recovered"); }
  }catch(e){
    console.warn("local save failed", e);
    dbg("[local] save FAILED:", e && e.message);
    // 2026-09-15: 以前はここが完全に無言で失敗していた（容量超過などで
    // setItem が例外を投げても console.warn だけ）。この端末には保存されずに

    // 編集が跡形もなく消える — 今回のクラウド側の事故とは別経路の

  }
}
function save(){
  saveLocal();
  if(SYNC_ENABLED && dbReady && !applyingRemote){
    flushPush();       // push each edit right away — an iOS kill can wipe localStorage
    schedulePush();    // + a short backstop in case that push was coalesced away
  }
  schedulePushTasksSync();   // v3.118: 通知オン時だけ、時間指定タスクをサーバーへ同期する
}

/* ---- shape <-> month-sharded docs ---- */
const mkey = s => (s || "").slice(0,7);   // "2026-09-09" -> "2026-09"
function splitToDocs(d){
  const core = {
    version: d.version || 1,
    meta: d.meta || {},
    settings: d.settings || { showOutlook:true },
    templates: d.templates || [],
    tasks: d.tasks || [],
    notes: d.notes || [],
    remarks: d.remarks || [],
  };
  const months = {};
  (d.occurrences || []).forEach(o=>{
    const k = mkey(o.date); if(!k) return;
    (months[k] = months[k] || { month:k, occ:[], dayMeta:{} }).occ.push(o);
  });
  Object.entries(d.dayMeta || {}).forEach(([date,v])=>{
    const k = mkey(date);
    (months[k] = months[k] || { month:k, occ:[], dayMeta:{} }).dayMeta[date] = v;
  });
  return { core, months };
}
function rebuildFromDocs(core, monthDocs){
  // documents from the DB come back FROZEN — deep-clone so the in-memory model
  // stays mutable (every edit does obj.field = value)
  const clone = x => (x == null ? x : JSON.parse(JSON.stringify(x)));
  core = clone(core) || {};
  const d = {
    version: core.version || 1,
    meta: core.meta || {},
    settings: core.settings || { showOutlook:true },
    templates: core.templates || [],
    tasks: core.tasks || [],
    notes: core.notes || [],
    remarks: core.remarks || [],
    occurrences: [],
    dayMeta: {},
  };
  (monthDocs || []).forEach(md=>{
    const m = clone(md) || {};
    (m.occ || []).forEach(o=>d.occurrences.push(o));
    Object.assign(d.dayMeta, m.dayMeta || {});
  });
  return migrate(d);
}
/* order-insensitive content hash — month-sharding reorders occurrences, so
   compare by sorted id, not array position */
const byId = (a,b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
const fingerprint = d => JSON.stringify({
  t: [...(d.tasks || [])].sort(byId),
  p: [...(d.templates || [])].sort(byId),
  n: [...(d.notes || [])].sort(byId),
  r: [...(d.remarks || [])].sort(byId),
  s: d.settings || {},
  o: [...(d.occurrences || [])].sort(byId),
  m: Object.fromEntries(Object.entries(d.dayMeta || {}).sort((a,b)=> a[0] < b[0] ? -1 : 1)),
});
function snapshotPushed(d){
  const { core, months } = splitToDocs(d);
  lastPushed = { coreStr: JSON.stringify(core), monthStrs: {} };
  Object.entries(months).forEach(([k,m])=> lastPushed.monthStrs[k] = JSON.stringify(m));
}
const isValidDb = d => !!d
  && Array.isArray(d.templates) && Array.isArray(d.tasks)
  && Array.isArray(d.occurrences) && d.dayMeta && typeof d.dayMeta === "object";
/* v3.86: 起動時にクラウド側を「採用」する処理は、以前はこの端末のデータを
   クラウドの内容で丸ごと置き換えていた。これだと、オフライン中にこの端末
   だけで加えた変更（まだクラウドに届いていないもの——例: オフラインで
   書いたメモ）が、あとでクラウド側を採用した瞬間に消えてしまうことがある
   （全体の保存時刻だけを見て「新しい方が勝ち」としていたため、個々の
   メモ・タスク・実施記録ごとの新旧までは分からなかった）。
   id単位で「クラウドの内容を優先しつつ、この端末にしかない項目は消さずに
   残す」マージに変更し、丸ごと消えることがないようにする。 */
const mergeById = (localArr, cloudArr) => {
  const map = new Map((localArr || []).map(x => [x.id, x]));
  (cloudArr || []).forEach(x => map.set(x.id, x));
  return [...map.values()];
};
const mergeDb = (local, cloud) => ({
  version: cloud.version || local.version || 1,
  meta: cloud.meta || local.meta || {},
  settings: cloud.settings || local.settings || { showOutlook:true },
  templates: mergeById(local.templates, cloud.templates),
  tasks: mergeById(local.tasks, cloud.tasks),
  notes: mergeById(local.notes, cloud.notes),
  remarks: mergeById(local.remarks, cloud.remarks),
  occurrences: mergeById(local.occurrences, cloud.occurrences),
  dayMeta: { ...(local.dayMeta || {}), ...(cloud.dayMeta || {}) },
});
function safeRender(){ try{ render(); }catch(e){ console.error("render failed", e); } }
function scrollToNow(){
  const nm = M.querySelector(".tl-row.now");
  if(nm && nm.scrollIntoView) nm.scrollIntoView({ block:"center" });
  else M.scrollTop = 0;
}
// 「今日のタスク」一覧内の該当カードへスクロール（タイムテーブルの状態表示からのジャンプ用）
function scrollToOcc(occId){
  const card = M.querySelector(`#occ-${CSS.escape(String(occId))}`);
  if(card && card.scrollIntoView) card.scrollIntoView({ block:"center" });
  else M.scrollTop = 0;
}

/* ---- Artifact DB ----  (any failure here must NEVER break the local app) */
async function initDB(){
  try{
    if(!SYNC_ENABLED){ syncMode = "local"; return; }
    if(!window.claude || !window.claude.use){ syncMode = "local"; dbg("[sync] no window.claude — local only"); return; }

    let ns = null;
    try{ ns = await window.claude.use("db"); }
    catch(e){ dbg("[sync] use(db) threw:", e.message); syncMode = "local"; return; }
    if(!ns){ dbg("[sync] use(db) -> null (unavailable)"); syncMode = "local"; return; }
    DB = ns;
    dbg("[sync] db namespace acquired");

    let coreSnap;
    try{ coreSnap = await DB.doc("core/main").get(); }
    catch(e){ dbg("[sync] core/main read threw:", e.message); syncMode = "error"; return; }
    dbg("[sync] core/main exists =", coreSnap.exists);
    syncMode = coreSnap.exists ? "step1-exists" : "step1-empty";
    if(SYNC_STEP < 2) return;

    // ---- The DB is the source of truth (this device's localStorage is not
    //      reliable — iOS clears it when the home-screen app is closed).
    //      Whichever copy was written more recently wins. ----
    const dbCore = coreSnap.exists ? (coreSnap.data() || {}) : null;
    const localTs = (db.meta && db.meta.savedAt) || "";
    const dbTs    = (dbCore && dbCore.meta && dbCore.meta.savedAt) || "";
    dbg("[sync] localTs:", localTs || "(none)", "dbTs:", dbTs || "(none)");

    // 手元の db に、DB から読み直した core/months をマージする共通処理
    // （v3.86〜：以前は「置き換え」だったのを「マージ」に変更——上の
    // mergeDb() 参照）。通常の採用（DBの方が新しい）と、下のガード
    // （採用しない側だが安全確認のため念のため採用）の両方から使う。
    // 成功したら true を返す。
    const adoptFromDB = async (label) => {
      let fresh, monthDocs;
      try{ monthDocs = (await DB.collection("months").get()).docs.map(s=>s.data() || {}); }
      catch(e){ dbg(`[sync] ${label} months read threw:`, e.message); return false; }
      dbg(`[sync] ${label} month docs:`, monthDocs.length);
      try{ fresh = rebuildFromDocs(dbCore, monthDocs); }
      catch(e){ dbg(`[sync] ${label} rebuild threw:`, e.message); return false; }
      if(!isValidDb(fresh)){ dbg(`[sync] ${label} DB data not well-formed — keeping local`); return false; }
      dbg(`[sync] ${label} fresh: tpl`, fresh.templates.length, "task", fresh.tasks.length, "occ", fresh.occurrences.length);

      // recovery insurance: if local had real data that differs, keep a copy
      if(fingerprint(fresh) !== fingerprint(db)){
        try{ localStorage.setItem(KEY + ".premerge", JSON.stringify(db)); dbg(`[sync] ${label} stashed local to premerge`); }catch(e){}
      }
      const prev = db;
      // v3.87: この端末側が「まだ何も手を付けていないサンプルデータ」
      // （`db.meta.sample`。loadLocal() が localStorage を読めず seed() に
      // フォールバックしたときに付く目印）のときは、v3.86のマージ対象では
      // ない——サンプルはユーザーの実データではないので、マージで「消さず
      // 残す」べきものが無い。にもかかわらずマージすると、フォールバックの
      // たびに新しいid付きのサンプルのタスク・メモがクラウド側の本物の
      // データへ次々と合流し、「書いた覚えのないメモが増える」という
      // 別の事故になる（実際に発生した）。このときだけは従来通り丸ごと
      // 置き換える。実データがある場合だけ v3.86 のマージを使う。
      const localIsSample = !!(db.meta && db.meta.sample);
      // v3.88: この分岐（この端末がサンプル状態から起動し直していた）に
      // 実際に入ったことを、無言のままにせず必ず知らせる——これまでの
      // 「メモが消える」事故の多くは、まさにこの分岐が無言で起きていた
      // ことに気づけなかったために原因の特定が難航した。
      // v3.97: ただし毎回トースト表示されるのは「邪魔」というユーザーの
      // 指摘を受け、画面への割り込みは廃止。デバッグ用途は設定内の
      // デバッグログ（dbg()）だけに残す。
      if(localIsSample){ dbg(`[sync] ${label} local was sample — replaced with cloud content`); }
      db = localIsSample ? fresh : mergeDb(db, fresh);
      try{ render(); dbg(`[sync] ${label} adopt render OK`); }
      catch(e){ dbg(`[sync] ${label} adopt render THREW:`, e.message); db = prev; safeRender(); return false; }
      dbReady = true;
      saveLocal();
      if(localIsSample){
        // 丸ごと置き換えただけなので、この端末は既にクラウドと同じ内容
        // ——無駄な書き戻しをしないよう、そのまま「同期済み」として記録する。
        snapshotPushed(db);
        syncMode = "synced";
      } else {
        // v3.86: マージ結果には、クラウドにまだ無い項目（この端末にしか
        // 無かったもの）が含まれ得るので、そのままクラウドへ書き戻す。
        // lastPushed は flushPush() 自身が実際に書き込んだ内容で更新するので、
        // ここで snapshotPushed() は呼ばない（呼ぶと「マージ結果はもう
        // クラウドと同じ」と誤認識し、この端末だけの項目が二度とクラウドへ
        // 送られなくなってしまう）。
        try{ await flushPush(); }
        catch(e){ dbg(`[sync] ${label} push-after-merge threw:`, e.message); syncMode = "error"; }
      }
      dbg(`[sync] ${label} adopted DB data (sample-replace=${localIsSample}) — syncMode:`, syncMode);
      return true;
    };

    if(dbCore && dbTs > localTs){
      if(!await adoptFromDB("adopt:")) { syncMode = "error"; return; }
    } else {
      // 2026-09-15: ここでかつて「クラウド側の予定データを確認なしに全削除して
      // からこの端末のデータで上書きする」処理（wipeMonths()）を行っていたが、
      // 何らかの理由でこの端末の手元の occurrences（予定・実施記録）だけが
      // 空になっていたケースで、クラウドに残っていた本物の予定データを
      // 丸ごと消してしまう事故が実際に発生した。タイムスタンプの新旧だけで
      // 「削除してよい」と判断するのは危険すぎるため、方針を変更する:
      //   1. 通常の起動時同期では、クラウドの予定データを絶対に削除しない
      //      （書き込み・上書きのみ。wipeMonths() は呼ばない）。
      //   2. 手元の occurrences が0件なのに、DB 側の core doc は既に存在する
      //      （＝ゼロでない可能性がある）場合は要注意。実際に DB 側の
      //      months を確認し、データが残っているならそちらを信用して
      //      採用する（空のはずの手元データで上書きしない）。
      let guarded = false;
      if(dbCore && db.occurrences.length === 0){
        let monthDocs = null;
        try{ monthDocs = (await DB.collection("months").get()).docs.map(s=>s.data() || {}); }
        catch(e){ dbg("[sync] guard months read threw:", e.message); }
        if(monthDocs && monthDocs.length){
          dbg("[sync] guard: local has 0 occurrences but DB has", monthDocs.length, "month doc(s) — adopting DB instead of pushing");
          guarded = await adoptFromDB("guard:");
        }
      }
      if(!guarded){
        dbReady = true;
        lastPushed = null;
        saveLocal();               // make sure local carries a fresh savedAt for the push
        try{ await flushPush(); }  // never wipeMonths() here — only explicit user resets do that
        catch(e){ dbg("[sync] push threw:", e.message); syncMode = "error"; dbReady = false; return; }
        dbg("[sync] pushed local data to DB — syncMode:", syncMode);
      }
    }

    if(SYNC_STEP < 4) return;
    subscribeDB();
  }catch(e){
    dbg("[sync] initDB threw:", e && e.message);
    syncMode = "local";
  }
}

function schedulePush(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(flushPush, 900);
}
/* flush pending writes when the app is backgrounded / closed — important on iOS
   where the home-screen app is killed and localStorage may be wiped */
function flushNow(){ try{ flushNoteSave(); }catch(e){} if(dbReady){ clearTimeout(pushTimer); flushPush(); } }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushNow(); });
window.addEventListener("pagehide", flushNow);
window.addEventListener("blur", flushNow);
async function flushPush(){
  if(!DB || !dbReady) return;
  if(pushing){ pushPending = true; return; }   // coalesce overlapping calls
  pushing = true;
  try{
    const { core, months } = splitToDocs(db);
    const coreStr = JSON.stringify(core);
    const writes = [];
    if(!lastPushed || lastPushed.coreStr !== coreStr) writes.push(DB.doc("core/main").set(core));
    const monthStrs = {};
    for(const [k,mdoc] of Object.entries(months)){
      const s = JSON.stringify(mdoc);
      monthStrs[k] = s;
      if(!lastPushed || lastPushed.monthStrs[k] !== s) writes.push(DB.doc("months/"+k).set(mdoc));
    }
    if(!writes.length){ syncMode = "synced"; return; }
    dbg("[sync] flush: writing", writes.length, "doc(s)");
    await Promise.all(writes);
    lastPushed = { coreStr, monthStrs };
    db.meta = db.meta || {}; db.meta.syncedAt = new Date().toISOString();
    syncMode = "synced";
    dbg("[sync] flush OK");
  }catch(e){
    dbg("[sync] flush FAILED:", (e && e.code) || (e && e.message));
    syncMode = (e && e.code === "quota_exceeded") ? "quota" : "error";
  }finally{
    pushing = false;
    if(pushPending){ pushPending = false; flushPush(); }   // run once more with the latest data
  }
}
async function wipeMonths(){
  if(!DB) return;
  try{
    const snap = await DB.collection("months").get();
    await Promise.all(snap.docs.map(s=>DB.doc("months/"+s.id).delete()));
  }catch(e){ console.warn("wipeMonths failed", e); }
}
function resyncFull(){          // after reset / import: replace DB contents wholesale
  if(!dbReady){ return; }
  lastPushed = null;
  wipeMonths().then(flushPush);
}

// v3.94（バグ調査で発見）: subscribeDB() は SYNC_STEP<4 のため現状呼ばれない
// （initDB() の `if(SYNC_STEP < 4) return;` で止まる）が、将来 SYNC_STEP を
// 上げれば動き出すコードであり、中身が v3.86 以前の「丸ごと置き換え」の
// ままだった。他端末からのリアルタイム更新を受け取るたびに `db = fresh`
// で手元のデータを丸ごと差し替えていたため、この端末側だけでまだクラウドに
// 届いていない変更（600msのデバウンス中に加えた編集など）が、他端末の
// 更新を受信した瞬間に消えてしまう——まさに v3.86 で `adoptFromDB()` に
// 対して直した「丸ごと置き換えによる消失」と同じ不具合を、起動時同期とは
// 別のこの経路にも残してしまっていた。adoptFromDB() と同じ mergeDb()/
// localIsSample の扱いにそろえる。
function subscribeDB(){
  const react = () => {
    clearTimeout(remoteTimer);
    remoteTimer = setTimeout(async ()=>{
      try{
        const cs = await DB.doc("core/main").get();
        if(!cs.exists) return;
        const monthDocs = (await DB.collection("months").get()).docs.map(s=>s.data() || {});
        const fresh = rebuildFromDocs(cs.data() || {}, monthDocs);
        if(!isValidDb(fresh) || fingerprint(fresh) === fingerprint(db)) return;
        const prev = db;
        applyingRemote = true;
        try{
          const localIsSample = !!(db.meta && db.meta.sample);
          db = localIsSample ? fresh : mergeDb(db, fresh);
          saveLocal(); render();
          if(localIsSample){
            snapshotPushed(db);
          } else {
            // マージ結果にこの端末だけの項目が残っているかもしれないので、
            // 「もう同期済み」と決めつけず、実際にクラウドへ書き戻す。
            await flushPush();
          }
          toast("別の端末の変更を反映しました");
        }catch(e){
          console.error("remote apply failed — reverting", e);
          db = prev; snapshotPushed(db); safeRender();
        }finally{
          applyingRemote = false;
        }
      }catch(e){ console.warn("remote sync failed", e); }
    }, 600);
  };
  try{
    DB.doc("core/main").onSnapshot(snap=>{ try{ if(!snap.metadata.hasPendingWrites) react(); }catch(e){} }, ()=>{});
    DB.collection("months").onSnapshot(snap=>{ try{ if(!snap.metadata.hasPendingWrites) react(); }catch(e){} }, ()=>{});
  }catch(e){ console.warn("subscribe failed", e); }
}
